apiKey: "None"
apiKeyRequired: false
url: "http://localhost:11434/api/chat"
model: "qwen2.5:7b"

# FanslationStudio.LlmKit's ConfigurationExtensions.GetConfiguration (used by
# JsonGameDataWorkflow/CsvGameDataWorkflow/PrefabTextWorkflow for their QualityReview.MinAcceptableScore
# gate) requires this section - mirrors DragonHierOverLlm's Config.yaml `models:`/`qualityReview:`
# shape, with quality review off. Additive alongside the legacy top-level fields above, which
# TranslationService's own (separate, pre-migration) Configuration.GetConfiguration still reads and
# ignores this section entirely - full Config.yaml schema migration is separate, later work.
models:
  - name: Qwen25-Standard
    modelPreset: Qwen25
    modelPresetType: Standard
    customPromptsPath:
    apiKeyPath:
  - name: Qwen25-StructuredText
    modelPreset: Qwen25
    modelPresetType: StructuredText
    customPromptsPath:
    apiKeyPath:
qualityReview:
  enabled: false

# apiKeyRequired: true
# url: "https://api.openai.com/v1/chat/completions"
# model: "gpt-4o-mini"

modelParams:
  # Qwen2.5
  temperature: 0.15
  top_p: 0.92
  top_k: 40
  repeat_penalty: 1.05
  frequency_penalty: 0
  presence_penalty: 0
  num_ctx: 16384
  num_predict: 512

  # Qwen 3.5
  # temperature: 0.2
  # top_p: 0.9
  # repeat_penalty: 1.05
  # frequency_penalty: 0
  # presence_penalty: 0
  # top_k: 40
  # min_p: 0
  # num_ctx: 16384
  # num_predict: 512
  
  # ChatGPT
  # temperature: 0.2
  # top_p: 0.9
  # frequency_penalty: 0
  # presence_penalty: 0
tagModelParams:
  # Qwen2.5
  temperature: 0
  top_p: 0.95
  top_k: 0
  repeat_penalty: 1.0
  frequency_penalty: 0
  presence_penalty: 0
  num_ctx: 16384
  num_predict: 512
  # Qwen 3.5
  # temperature: 0
  # top_p: 0.9
  # repeat_penalty: 1.0
  # frequency_penalty: 0
  # presence_penalty: 0
  # top_k: 0
  # min_p: 0
  # num_ctx: 16384
  # num_predict: 512
retryCount: 4
batchSize: 20000
skipLineValidation: false
correctionPromptsEnabled: true
translateFlagged: true
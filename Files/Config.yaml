# Model choice and QC model/quant/process-shape decision ported from DragonHierOverLlm's
# investigation - see that repo's docs/investigations/tests/qc-evaluator-model-selection.md. The
# FIRST entry in this list is the main translator model (see FanslationStudio.LlmKit's
# LlmHelpers.CalculateModelConfig).
models:
  - name: HyMT2-7B
    modelPreset: HyMT2
    modelPresetType: Standard
  - name: Qwen38Qc-IQ4XS
    modelPreset: Qwen38
    modelPresetType: Standard
    model: "hf.co/unsloth/Qwen3.8-27B-GGUF:UD-IQ4_XS"
  - name: Qwen25-Standard
    modelPreset: Qwen25
    modelPresetType: Standard
    customPromptsPath:
    apiKeyPath:
  - name: Qwen25-StructuredText
    modelPreset: Qwen25
    modelPresetType: StructuredText
    customPromptsPath:
    apiKeyPath:
  - name: Qwen38Qc
    modelPreset: Qwen38
    modelPresetType: Standard
# Same options as DragonHierOverLlm's Config.yaml, see that repo's
# docs/investigations/tests/qc-evaluator-model-selection.md for why. minAcceptableScore lowered from
# 70 to match; twoStageVerificationEnabled/verifyNoDefectClaims dropped - dead config keys, no longer
# read anywhere in FanslationStudio.LlmKit.
qualityControl:
  enabled: true
  modelName: Qwen38Qc-IQ4XS
  minAcceptableScore: 60
  maxConcurrency: 2
  inlineRuleCheckRetries: 2
  autoAcceptDefectCategories: [HardToParseSeam, OtherNamedDefect, DroppedContent, DroppedStutter]
glossaryPreset:
  usePresetChineseGlossary: true
  chineseGlossaryTypesToSupress:
    - Phonetics
useContinuousWorkerPool: true
maxConcurrency: 4 # Ollama is capped anyway
retryCount: 3 # No escalation model configured - extra retries burn time on the same main translator model
skipLineValidation: false
correctionPromptsEnabled: true
batchSize: 100
translateFlagged: true
# Adds per-line context from the game (speaker, gender) to the prompt; does nothing until the game sets a LineContextProvider hook.
lineContextEnabled: true
# Flags translations with an invented/wrong gender or "I" narration for retranslation during ApplyAllRulesToCurrentTranslation
# (once per line per run). Lines whose translation names a character are checked too.
pronounCheck:
  enabled: true
  skipWhenTranslationNamesSomeone: false

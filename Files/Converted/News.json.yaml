    text: "有一处邪异山谷，过路之人多难从中走出，当地府衙曾组织人手多番探查，不但未曾发现其中端倪，办事的捕快还走失了几个，从此也只能不了了之。"
    translated: "There is a Strange Valley where travelers often struggle to emerge alive. Local authorities have organized multiple expeditions to investigate, but they have failed to uncover any clues. In fact, several officers went missing during these investigations, leaving the matter unresolved."

- raw: "{\r\n    \"Key\": \"10027\",\r\n    \"Title\": \"手札笔记\",\r\n    \"ConditionSatisfiedDesc\": \"既然已经答应了<color=#BA77D9>灵儿祖父</color>此后在<color=#77CED9>湘东</color>接受老人家的幻术试炼，在此之前便要做好准备，勤于提升<color=#77CED9>悟性</color>或能更容易将幻术勘破。\",\r\n    \"ConditionUnsatisfiedDesc\": \"传言<color=#77CED9>荆北</color>有一处邪异山谷，过路之人多难从其中走出，当地府衙也曾组织人手多番探查，不但未曾发现其中端倪，办事的捕快还走失了几个，从此也只能不了了之。\",\r\n    \"ConditionSatisfiedDescTw\": \"既然已經答應了<color=#BA77D9>靈兒祖父</color>此後在<color=#77CED9>湘東</color>接受老人家的幻術試煉，在此之前便要做好準備，勤於提升<color=#77CED9>悟性</color>或能更容易將幻術勘破。\",\r\n    \"ConditionUnsatisfiedDescTw\": \"傳言<color=#77CED9>荊北</color>有一處邪異山谷，過路之人多難從其中走出，當地府衙也曾組織人手多番探查，不但未曾發現其中端倪，辦事的捕快還走失了幾個，從此也只能不了了之。\",\r\n    \"TitleTw\": \"手札筆記\"\r\n  }"

    text: "一向年光有限身，等闲离别易销魂，酒筵歌席莫辞频。满目山河空念远，落花风雨更伤春，"
    translated: "A life of limited years, casual partings easily steal the soul; do not refuse frequent wine feasts and song. With eyes full of mountains and rivers, yearning for distant places in vain, fallen flowers in wind and rain wound the heart even more in spring."

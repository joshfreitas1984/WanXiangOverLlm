- raw: "{\r\n    \"Key\": \"2\",\r\n    \"Name\": \"阮碧青\",\r\n    \"Desc\": \"①御兽到达入门探索盘蛇谷蒋疠夫传授牧蛇术\\\\n②再次探索盘蛇谷认阮碧青为姐姐\\\\n③第五年一月起，好感到达50可去荆东帮助阮碧青送家信\\\\n④探索荆东送完家信后再次探索盘蛇谷回报阮碧青\\\\n⑤第六年一月起，若盘蛇谷与阮碧青友好度都到达60，御兽到达130，探索盘蛇谷内可发现阮碧青暗算蒋疠夫，选择帮助阮碧青\\\\n⑥阮碧青加入后且御兽到达大师，探索九嶷山遇到异蛇王，战胜后选择赠与阮碧青，解锁阮碧青红颜\\\\n⑦在盘蛇谷认阮碧青为姐姐后，阮碧青好感未达到60，探索盘蛇谷可遇到阮碧青传授御兽之术\\\\n-可重复\\\\n\",\r\n    \"LockDesc\": \"第三年一月起，探索湘南帮助阮碧青赶走无赖，再次探索湘南得知九嶷山蛇患，探索九嶷山击败异蛇获取蛇胆，再次探索湘南，由盘蛇谷弟子带领开启盘蛇谷，结识阮碧青。\",\r\n    \"RepeatDesc\": \"在盘蛇谷认阮碧青为姐姐后，阮碧青好感未达到60，探索盘蛇谷可遇到阮碧青传授御兽之术。\\\\n<color=#ff0000>注意：</color>在阮碧青加入前触发九嶷山异蛇王事件，将无法解锁阮碧青红颜\",\r\n    \"GuidDescList\": [\r\n      \"御兽到达入门探索盘蛇谷蒋疠夫传授牧蛇术。\",\r\n      \"再次探索盘蛇谷认阮碧青为姐姐。\",\r\n      \"第五年一月起，好感到达50可去荆东帮助阮碧青送家信。\",\r\n      \"探索荆东送完家信后再次探索盘蛇谷回报阮碧青。\",\r\n      \"第六年一月起，若盘蛇谷与阮碧青友好度都到达60，御兽到达130，探索盘蛇谷内可发现阮碧青暗算蒋疠夫，选择帮助阮碧青。\",\r\n      \"阮碧青加入后且御兽达到大师，探索九嶷山遇到异蛇王，战胜后选择赠与阮碧青，解锁阮碧青红颜。盘蛇谷关闭后可到九嶷山提高御兽。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"阮碧青\",\r\n    \"DescTw\": \"①御獸到達入門探索盤蛇谷蔣癘夫傳授牧蛇術\\\\n②再次探索盤蛇谷認阮碧青為姐姐\\\\n③第五年一月起，好感到達50可去荊東幫助阮碧青送家信\\\\n④探索荊東送完家信後再次探索盤蛇谷回報阮碧青\\\\n⑤第六年一月起，若盤蛇谷與阮碧青友好度都到達60，御獸到達130，探索盤蛇谷內可發現阮碧青暗算蔣癘夫，選擇幫助阮碧青\\\\n⑥阮碧青加入後且御獸到達大師，探索九嶷山遇到異蛇王，戰勝後選擇贈與阮碧青，解鎖阮碧青紅顏\\\\n⑦在盤蛇谷認阮碧青為姐姐後，阮碧青好感未達到60，探索盤蛇谷可遇到阮碧青傳授御獸之術\\\\n-可重複\\\\n\",\r\n    \"LockDescTw\": \"第三年一月起，探索湘南幫助阮碧青趕走無賴，再次探索湘南得知九嶷山蛇患，探索九嶷山擊敗異蛇獲取蛇膽，再次探索湘南，由盤蛇谷弟子帶領開啟盤蛇谷，結識阮碧青。\",\r\n    \"RepeatDescTw\": \"在盤蛇谷認阮碧青為姐姐後，阮碧青好感未達到60，探索盤蛇谷可遇到阮碧青傳授御獸之術。\\\\n<color=#ff0000>注意：</color>在阮碧青加入前觸發九嶷山異蛇王事件，將無法解鎖阮碧青紅顏\",\r\n    \"GuidDescTwList\": [\r\n      \"御獸到達入門探索盤蛇谷蔣癘夫傳授牧蛇術。\",\r\n      \"再次探索盤蛇谷認阮碧青為姐姐。\",\r\n      \"第五年一月起，好感到達50可去荊東幫助阮碧青送家信。\",\r\n      \"探索荊東送完家信後再次探索盤蛇谷回報阮碧青。\",\r\n      \"第六年一月起，若盤蛇谷與阮碧青友好度都到達60，御獸到達130，探索盤蛇谷內可發現阮碧青暗算蔣癘夫，選擇幫助阮碧青。\",\r\n      \"阮碧青加入後且御獸達到大師，探索九嶷山遇到異蛇王，戰勝後選擇贈與阮碧青，解鎖阮碧青紅顏。盤蛇谷關閉後可到九嶷山提高御獸。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

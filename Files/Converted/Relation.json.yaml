    text: "暂位于荆南荆州府荆州城内通天观后街树荫巷内撂地作场，是荆湘一带十分有名的杂耍班子，班中之人互通皆以艺名，并将福字冠之为姓，常年游走于荆湘各府之间，所表演的杂耍戏法技艺都颇有独到之处。"
    translated: "Currently situated in the Shade Alley behind Tongtian Monastery within Jizhou City of Jingnan, this is a very famous troupe in the region of Jingxiang. The performers all use art names and have adopted the character Fu as their surname. They travel frequently between various cities in Jingxiang, performing tricks and acrobatics with unique skills."

  - splitPath: GuidDescList[3]
    text: "探索荆东遇到澜沧商人开启荆南宝象阁，第七年时财富到达5000探索宝象阁购买柔佛老树根，探索神农谷将柔佛老树根赠与连山谷种植长生稻，完成连翘儿第二个愿望。若购买过柔佛老树根在其他地方已消耗，财富到达3000可再次探索宝象阁购买老树根。"
    translated: "Exploring Jingdong led to encountering the Lan Cang Merchant and opening up the Jinnan Baoxiang Pavilion. In the seventh year, wealth reached 5000 by exploring the Baoxiang Pavilion and purchasing the soft old tree root from the Rou Fu region. Exploring Shennong Valley, they gifted the soft old tree root to Lian Shangu for planting immortal rice, fulfilling Lian Qiaoer's second wish. If one has already purchased and consumed the soft old tree root elsewhere, reaching a wealth of 3000 in the seventh year allows for another exploration of the Baoxiang Pavilion to buy an old tree root again."
    qcReviewedText: "Exploring Jingdong led to encountering the Lan Cang Merchant and opening up the Jinnan Baoxiang Pavilion. In the seventh year, wealth reached 5000 by exploring the Baoxiang Pavilion and purchasing the soft old tree root from the Rou Fu region. Exploring Shennong Valley, they gifted the soft old tree root to Lian Shangu for planting immortal rice, fulfilling Lian Qiaoer's second wish. If one has already purchased and consumed the soft old tree root elsewhere, reaching a wealth of 3000 in the seventh year allows for another exploration of the Baoxiang Pavilion to buy an old tree root again."
    qcTranslated: "Exploring Jingdong, you encounter the Lancang Merchant and unlock the Jinnan Baoxiang Pavilion. In Year 7, when your Wealth reaches 5000, explore the Baoxiang Pavilion to purchase the Soft Old Tree Root. Explore Shennong Valley and gift the Soft Old Tree Root to Lian Shangu to plant Longevity Rice, fulfilling Lian Qiaoer's second wish. If you have already purchased and consumed a Soft Old Tree Root elsewhere, reaching Wealth 3000 allows you to explore the Baoxiang Pavilion again to buy another."
    qcStatus: Corrected
    qcQualityScore: 82
    qcDefectCategory: OtherNamedDefect

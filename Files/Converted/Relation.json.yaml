  - splitPath: Desc
    text: "探索荆东酒楼服下连翘儿的七香豆"
    translated: "Explore Jingdong Tavern to find Lian Qiaoer and give her the Seven Fragrance Beans."
    qcReviewedText: "①Explore Jingdong Tavern to find Lian Qiaoer and give her the Seven Fragrance Beans.\\n②Exploring Jingbei, I brought Lian Qiaoer to Lian Shangu to apologize.\\n③Exploring Shen Nong Valley when Golden Branch Forsythia blooms in any April, you learn that Lian Qiaoer has three wishes. The first wish is fulfilled when the Forsythia blooms.\\n④Exploring Jingdong and encountering Lancang merchants to open the Jingnan Treasure Elephant Pavilion. In the seventh year, when wealth reaches 5000, explore the Treasure Elephant Pavilion to purchase a Soft Buddha ancient tree root. Explore Shenong Valley and gift the Soft Buddha ancient tree root to Lian Shangu for planting the immortal rice. Complete Lian Qiaoer's second wish. If you have previously purchased a Soft Buddha ancient tree root and consumed it elsewhere, when wealth reaches 3000, you can explore the Treasure Elephant Pavilion again to purchase an old tree root.\\n⑤Exploring Shen Nong Valley and presenting the tender roots of the ancient tree to Lian Shangu for planting the immortal rice will fulfill Lian Qiaoer's second wish.\\n⑥Exploring Shen Nong Valley to discover and fulfill Lian Qiaoer's third wish, unlock Lian Qiaoer as a Red Beauty."
    qcTranslated: "1. Explore Jingdong Tavern to find Lian Qiaoer and give her the Seven Fragrance Beans.\\n2. Explore Jingbei Shen Nong Valley, bringing Lian Qiaoer to apologize to Lian Shangu.\\n3. In any Year's April, explore Shen Nong Valley. When Golden Branch Forsythia blooms, learn that Lian Qiaoer has three wishes. The first wish is fulfilled when the Forsythia blooms.\\n4. Explore Jingdong and encounter Lancang merchants to open the Jingnan Treasure Elephant Pavilion. In the seventh Year, when Wealth reaches 5000, explore the Treasure Elephant Pavilion to purchase a Soft Buddha ancient tree root. Explore Shen Nong Valley and gift the Soft Buddha ancient tree root to Lian Shangu for planting the immortal rice, completing Lian Qiaoer's second wish. If you have previously purchased a Soft Buddha ancient tree root and consumed it elsewhere, when Wealth reaches 3000, you can explore the Treasure Elephant Pavilion again to purchase an old tree root.\\n5. Explore Shen Nong Valley and gift the Soft Buddha ancient tree root to Lian Shangu for planting the immortal rice, completing Lian Qiaoer's second wish.\\n6. Explore Shen Nong Valley to discover and fulfill Lian Qiaoer's third wish, unlocking Lian Qiaoer as a Red Beauty."
    qcStatus: Corrected
    qcQualityScore: 82
    qcDefectCategory: DroppedContent
  - splitPath: Desc
    subIndex: 1
    text: "探索荆北神农谷带着连翘儿向连山谷请罪"
    translated: "Exploring Jingbei, I brought Lian Qiaoer to Lian Shangu to apologize."
  - splitPath: Desc
    subIndex: 2
    text: "任意一年四月探索神农谷遇到金枝连翘开花，得知连翘儿有三个愿望，连翘花开第一个愿望"
    translated: "Exploring Shen Nong Valley when Golden Branch Forsythia blooms in any April, you learn that Lian Qiaoer has three wishes. The first wish is fulfilled when the Forsythia blooms."
  - splitPath: Desc
    subIndex: 3
    text: "探索荆东遇到澜沧商人开启荆南宝象阁，第七年时财富到达5000探索宝象阁购买柔佛老树根，探索神农谷将柔佛老树根赠与连山谷种植长生稻，完成连翘儿第二个愿望。若购买过柔佛老树根并在其他地方已消耗，财富到达3000可再次探索宝象阁购买老树根。"
    translated: "Exploring Jingdong and encountering Lancang merchants to open the Jingnan Treasure Elephant Pavilion. In the seventh year, when wealth reaches 5000, explore the Treasure Elephant Pavilion to purchase a Soft Buddha ancient tree root. Explore Shenong Valley and gift the Soft Buddha ancient tree root to Lian Shangu for planting the immortal rice. Complete Lian Qiaoer's second wish. If you have previously purchased a Soft Buddha ancient tree root and consumed it elsewhere, when wealth reaches 3000, you can explore the Treasure Elephant Pavilion again to purchase an old tree root."
  - splitPath: Desc
    subIndex: 4
    text: "探索神农谷将柔佛老树根赠与连山谷种植长生稻，完成连翘儿第二各愿望"
    translated: "Exploring Shen Nong Valley and presenting the tender roots of the ancient tree to Lian Shangu for planting the immortal rice will fulfill Lian Qiaoer's second wish."
  - splitPath: Desc
    subIndex: 5
    text: "探索神农谷得知连翘儿第三愿望并完成，解锁连翘儿红颜"
    translated: "Exploring Shen Nong Valley to discover and fulfill Lian Qiaoer's third wish, unlock Lian Qiaoer as a Red Beauty."

    translated: "After helping the woman in green fight off the thugs and obtaining a Snake Gallbladder from Jiuyi Mountain, explore Xiangnan and visit Coiled Serpent Valley to begin."
    qcReviewedText: "After helping the woman in green fight off the thugs and obtaining a Snake Gallbladder from Jiuyi Mountain, explore Xiangnan and visit Coiled Serpent Valley to begin.\\nUnlocks when amiability with Coiled Serpent Valley reaches 100."

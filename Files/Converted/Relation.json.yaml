  - splitPath: Desc
    text: "御兽到达入门探索盘蛇谷蒋疠夫传授牧蛇术"
    translated: "Beast Taming has reached the entry stage, exploring Coiled Serpent Valley. Jiang Lifu teaches the Snake Herding technique."
    qcReviewedText: "①Beast Taming has reached the entry stage, exploring Coiled Serpent Valley. Jiang Lifu teaches the Snake Herding technique.\\n②Starting from January of the fifth year, when Affection reaches 50, you can go to Jingdong to help Ruan Biqing deliver a family letter.\\n③After delivering a letter home from Jingdong, explore Coiled Serpent Valley again to report back to Ruan Biqing.\\n④Starting from January of the sixth year, if both Coiled Serpent Valley and Ruan Biqing's friendship levels reach 60, exploring within Coiled Serpent Valley will reveal that Ruan Biqing has ambushed Jiang Lifu. Choose to help Jiang Lifu.\\n⑤Starting from January of the sixth year, upon reaching Master level in Beast Taming, explore Jiuyi Mountain and encounter the Strange Snake King. After defeating it, choose to kill the snake and obtain the Strange Snake King Gallbladder for future use.\\n⑥Starting from January of the sixth year, upon reaching Master level in Beast Taming, explore Jiuyi Mountain and encounter the Strange Snake King. After defeating it, choose to kill the snake and take its gallbladder.\\n⑦Exploring Coiled Serpent Valley and presenting the Strange Snake King Gallbladder to Jiang Lifu for treating injuries.\\n⑧Exploring Coiled Serpent Valley again, Jiang Lifu joins after recovering from his injuries, unlocking Coiled Serpent Valley.\\n⑨Exploring Coiled Serpent Valley allows you to learn Beast Taming from Jiang Lifu and Ruan Biqing.-Repeatable"
    qcStatus: Passed
    qcQualityScore: 100
    qcDefectCategory: None
  - splitPath: Desc
    subIndex: 1
    text: "第五年一月起，好感到达50可去荆东帮助阮碧青送家信"
    translated: "Starting from January of the fifth year, when Affection reaches 50, you can go to Jingdong to help Ruan Biqing deliver a family letter."
  - splitPath: Desc
    subIndex: 2
    text: "探索荆东送完家信后再次探索盘蛇谷回报阮碧青"
    translated: "After delivering a letter home from Jingdong, explore Coiled Serpent Valley again to report back to Ruan Biqing."
  - splitPath: Desc
    subIndex: 3
    text: "第六年一月起，若盘蛇谷与阮碧青友好度都到达60，探索盘蛇谷内可发现阮碧青暗算蒋疠夫，选择帮助蒋疠夫"
    translated: "Starting from January of the sixth year, if both Coiled Serpent Valley and Ruan Biqing's friendship levels reach 60, exploring within Coiled Serpent Valley will reveal that Ruan Biqing has ambushed Jiang Lifu. Choose to help Jiang Lifu."
  - splitPath: Desc
    subIndex: 4
    text: "第六年一月起，御兽到达大师，探索九嶷山遇到异蛇王，战胜后选择杀蛇取胆以做后用获取异蛇王胆"
    translated: "Starting from January of the sixth year, upon reaching Master level in Beast Taming, explore Jiuyi Mountain and encounter the Strange Snake King. After defeating it, choose to kill the snake and obtain the Strange Snake King Gallbladder for future use."
  - splitPath: Desc
    subIndex: 5
    text: "第六年一月起，御兽到达大师，探索九嶷山遇到异蛇王，战胜后选择杀蛇取胆"
    translated: "Starting from January of the sixth year, upon reaching Master level in Beast Taming, explore Jiuyi Mountain and encounter the Strange Snake King. After defeating it, choose to kill the snake and take its gallbladder."
  - splitPath: Desc
    subIndex: 6
    text: "探索盘蛇谷将异蛇王胆赠与蒋疠夫治伤"
    translated: "Exploring Coiled Serpent Valley and presenting the Strange Snake King Gallbladder to Jiang Lifu for treating injuries."
  - splitPath: Desc
    subIndex: 7
    text: "再次探索盘蛇谷，蒋疠夫伤愈加入，解锁盘蛇谷"
    translated: "Exploring Coiled Serpent Valley again, Jiang Lifu joins after recovering from his injuries, unlocking Coiled Serpent Valley."
  - splitPath: Desc
    subIndex: 8
    text: "探索盘蛇谷可向蒋疠夫、阮碧青学习御兽"
    translated: "Exploring Coiled Serpent Valley allows you to learn Beast Taming from Jiang Lifu and Ruan Biqing."

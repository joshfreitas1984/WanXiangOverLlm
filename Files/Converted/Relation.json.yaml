  - splitPath: Desc
    text: "第四年一月开始，财富到达1000探索荆北，在夏侯珺处任意购买一件物品开启六合庄"
    translated: "Starting from January of the fourth year, when your wealth reaches 1000, explore Jingbei and purchase any item from Xiahou Jun to unlock the Six Harmonies Manor."
    qcReviewedText: "①Starting from January of the fourth year, when your wealth reaches 1000, explore Jingbei and purchase any item from Xiahou Jun to unlock the Six Harmonies Manor.\\n②Buying treasures from the Six Harmonies Sect can increase Affection to varying degrees based on the value of the treasure.\\n③Starting in January of the seventh year, the Six Harmonies Sect began friendly relations with 50. Explore the Six Harmonies Sect's transport of official grain and defeat Cui Sanguan and his followers lying in ambush.\\n④The friendly Six Harmonies Sect has arrived at 80. After exploring the Six Harmonies Manor and protecting Xiahou Chao by defeating the rebel Zhong Qibei, Xiahou Chao joins the Six Harmonies Sect, unlocking the Six Harmonies Sect.\\n⑤Exploring the Six Harmonies Sect allows you to escort merchant ships to earn money.\\n-Repeatable"
    qcTranslated: "1. Starting from January of the fourth year, when your wealth reaches 1000, explore Jingbei and purchase any item from Xiahou Jun to unlock the Six Harmonies Manor.\\n2. Buying treasures from the Six Harmonies Sect can increase Affection to varying degrees based on the value of the treasure.\\n3. Starting in January of the seventh year, once the Six Harmonies Sect's friendship reaches 50., explore the Six Harmonies Sect's transport of official grain and defeat Cui Sanguan and his followers lying in ambush.\\n4. Once the Six Harmonies Sect's friendship reaches 80., explore the Six Harmonies Manor and protect Xiahou Chao by defeating the rebel Zhong Qibei; after this, Xiahou Chao joins, unlocking the Six Harmonies Sect.\\n5. Exploring the Six Harmonies Sect allows you to escort merchant ships to earn money.\\n‑Repeatable"
    qcStatus: Corrected
    qcQualityScore: 82
    qcDefectCategory: HardToParseSeam

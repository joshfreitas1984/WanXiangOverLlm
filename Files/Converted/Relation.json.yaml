  - splitPath: DetailDesc
    text: "位于荆北郧阳府郧西县内，毗邻汉江支流金钱河，由夏侯朝创立，靠着金钱河河运往来于荆湘、关陇之间，做两地的生意和运输。帮主【朝秦暮楚】夏侯朝豁达干练，广交善缘，荆湘、关陇两地与其帮中有生意往来者甚众。"
    translated: "Located in Yunxi County of Yunchang Prefecture in Jinhubei, bordering the tributary of the Han River known as Money River, this place was founded by Xiahou Chao. Relying on the river transport along Money River, it facilitates trade and transportation between Jingxiang and Guanlong regions. The Gang Master  【Fickle as morning and evening loyalties】  Xiahou Chao is broad‑minded and efficient, making many friends and allies. There are numerous individuals in both Jingxiang and Guanlong who conduct business with his gang."
    qcReviewedText: "Located in Yunxi County of Yunchang Prefecture in Jinhubei, bordering the tributary of the Han River known as Money River, this place was founded by Xiahou Chao. Relying on the river transport along Money River, it facilitates trade and transportation between Jingxiang and Guanlong regions. The Gang Master  【Fickle as morning and evening loyalties】  Xiahou Chao is broad‑minded and efficient, making many friends and allies. There are numerous individuals in both Jingxiang and Guanlong who conduct business with his gang."

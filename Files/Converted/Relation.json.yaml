    translated: "Starting in January of the fourth year, when Insight reaches 100, explore Xiangnan and encounter Tan Tingyu at the Wuxi Stone Carvings. Afterward, exploring Xiangxi and encountering Tan Tingyu again at the Faxiang Rock will unlock it."

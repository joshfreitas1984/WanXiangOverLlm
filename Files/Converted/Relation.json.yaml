- raw: "{\r\n    \"Key\": \"1002\",\r\n    \"Name\": \"万寿帮\",\r\n    \"Desc\": \"①拜师衡山派、武当派万寿帮开启后探索万寿帮拜访彭祖寿\\\\n②第四年七月起至第六年十二月，探索湘南遇到蒋承筹战胜抓住送往万寿庄\\\\n③第六年时财富到达5000探索荆东遇到澜沧商人购买一根柔佛老树根，若第六年购买过柔佛老树根在其他地方已消耗，第八年时财富到达4000探索荆东可再次从澜沧商人处购买一根柔佛老树根\\\\n④第六年一月开始，万寿庄友好到达80，拥有老树根，可用老树根救治彭祖寿\\\\n⑤再次探索万寿庄彭祖寿加入，解锁万寿帮\\\\n⑥探索万寿庄可听彭祖寿讲江湖旧闻\\\\n-可重复\",\r\n    \"DetailDesc\": \"位于荆东武昌府蒲圻县内，由彭祖寿创立，帮中辖下产业颇多，店铺、田产皆有涉及，遍及武昌五县之地，是荆东第一大帮。帮主【百福翁】彭祖寿年近百岁，老迈昏聩，一心只求收集天下奇珍宝药益寿延年。\",\r\n    \"LockDesc\": \"第三年参与万寿帮寿宴时揭露蒋成筹阴谋，第四年过年时自动受邀开启。\\\\n与万寿帮友好度到达100解锁。\",\r\n    \"RepeatDesc\": \"探索万寿庄可听彭祖寿讲江湖旧闻。\",\r\n    \"GuidDescList\": [\r\n      \"第四年七月起，探索湘南遇到蒋承筹战胜抓住送往万寿庄。\",\r\n      \"第六年一月开始，万寿庄友好到达80，拥有老树根，可用老树根救治彭祖寿。探索荆东遇到澜沧商人开启荆南宝象阁，第七年时财富到达5000探索宝象阁可购买一根柔佛老树根，若第七年购买过柔佛老树根在其他地方已消耗，财富到达3000可再次探索宝象阁购买老树根。\",\r\n      \"探索万寿庄彭祖寿加入，解锁万寿帮。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"萬壽幫\",\r\n    \"DescTw\": \"①拜師衡山派、武當派萬壽幫開啟後探索萬壽幫拜訪彭祖壽\\\\n②第四年七月起至第六年十二月，探索湘南遇到蔣承籌戰勝抓住送往萬壽莊\\\\n③第六年時財富到達5000探索荊東遇到瀾滄商人購買一根柔佛老樹根，若第六年購買過柔佛老樹根在其他地方已消耗，第八年時財富到達4000探索荊東可再次從瀾滄商人處購買一根柔佛老樹根\\\\n④第六年一月開始，萬壽莊友好到達80，擁有老樹根，可用老樹根救治彭祖壽\\\\n⑤再次探索萬壽莊彭祖壽加入，解鎖萬壽幫\\\\n⑥探索萬壽莊可聽彭祖壽講江湖舊聞\\\\n-可重複\",\r\n    \"DetailDescTw\": \"位於荊東武昌府蒲圻縣內，由彭祖壽創立，幫中轄下產業頗多，店鋪、田產皆有涉及，遍及武昌五縣之地，是荊東第一大幫。幫主【百福翁】彭祖壽年近百歲，老邁昏聵，一心只求收集天下奇珍寶藥益壽延年。\",\r\n    \"LockDescTw\": \"第三年參與萬壽幫壽宴時揭露蔣成籌陰謀，第四年過年時自動受邀開啟。\\\\n與萬壽幫友好度到達100解鎖。\",\r\n    \"RepeatDescTw\": \"探索萬壽莊可聽彭祖壽講江湖舊聞。\",\r\n    \"GuidDescTwList\": [\r\n      \"第四年七月起，探索湘南遇到蔣承籌戰勝抓住送往萬壽莊。\",\r\n      \"第六年一月開始，萬壽莊友好到達80，擁有老樹根，可用老樹根救治彭祖壽。探索荊東遇到瀾滄商人開啟荊南寶象閣，第七年時財富到達5000探索寶象閣可購買一根柔佛老樹根，若第七年購買過柔佛老樹根在其他地方已消耗，財富到達3000可再次探索寶象閣購買老樹根。\",\r\n      \"探索萬壽莊彭祖壽加入，解鎖萬壽幫。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

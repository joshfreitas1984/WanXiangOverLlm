    text: "第四年一月起，厨艺到达40探索湘东可遇翁和仲邀请吃叫花鸡"
    translated: "Starting from January of the fourth year, when Cooking reaches level 40, exploring Xiangdong may lead to encountering Weng Hezhong, who invites you to try Beggar's Chicken."
    qcReviewedText: "①Starting from January of the fourth year, when Cooking reaches level 40, exploring Xiangdong may lead to encountering Weng Hezhong, who invites you to try Beggar's Chicken.\\n②After the Prosperous Lane opens, explore it to visit Weng Hezhong.\\n③Upon revisiting Prosperous Lane to hear about the Black Rabbit Soup, in January of the fourth year, I began exploring Southern Hunan where I could encounter a fierce tiger. After defeating it, I could obtain tiger bone.\\n④Explore Prosperous Lane again to hear about grilled meat. With basic cooking skills, venture into Wild Boar Forest to encounter wild boars. Defeating them will yield a wild boar hind leg.\\n⑤Cooking skill reaches expert level, Beggars' Sect Zhong character faction friendship reaches 80, after successfully answering questions in the Prosperous Lane, Weng Hezhong joins, unlocks Beggars' Sect Zhong character faction\\n⑥Exploring Prosperous Lane allows you to learn cooking from Weng Hezhong.\\n-Repeatable"
    qcTranslated: "1. Starting from January of the fourth year, when Cooking reaches level 40, exploring Xiangdong may lead to encountering Weng Hezhong, who invites you to try Beggar's Chicken.\\n2. After the Prosperous Lane opens, explore it to visit Weng Hezhong.\\n3. Upon revisiting Prosperous Lane to hear about the Black Rabbit Soup, in January of the fourth year, exploring Southern Xiang may lead to encountering a Fierce Tiger. After defeating it, you can obtain Tiger Bone.\\n4. Explore Prosperous Lane again to hear about grilled meat. With basic cooking skills, venture into Wild Boar Forest to encounter Wild Boars. Defeating them will yield a Wild Boar Hind Leg.\\n5. Cooking skill reaches expert level, Beggars' Sect Zhong character faction friendship reaches 80, after successfully answering questions in the Prosperous Lane, Weng Hezhong joins, unlocks Beggars' Sect Zhong character faction\\n6. Exploring Prosperous Lane allows you to learn cooking from Weng Hezhong.\\n‑Repeatable"

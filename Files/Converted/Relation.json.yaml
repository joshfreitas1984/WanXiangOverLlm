    text: "位于湘东长沙府长沙城中，是丐帮八大分舵之一，统领荆楚一地丐帮弟子，门中弟子相互照应，虽以乞化为生，却不行不义之举，舵主【大肚奇丐】翁和仲开朗豁达，乐天知命，在丐帮各大长老中尤以厨艺闻名。"
    translated: "Located in Changsha City, Xiangdong Prefecture, this is one of the Eight Major Sub‑branches of the Beggar Sect. It oversees the disciples of the Beggar Sect in Jingchu region. The disciples support each other within the sect, despite relying on alms for their livelihood, they never engage in unjust acts. The sub‑branch leader  【Great Belly Strange Beggar】  Weng Hezhong is outgoing and content with life. He is particularly renowned among the various Elders of the Beggar Sect for his exceptional cooking skills."

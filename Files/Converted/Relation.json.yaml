  - splitPath: DetailDesc
    text: "位于湘北澧州府澧州城西十里外，本名武家庄，后四位庄主为纪念道人十年挂锤传艺之恩将其改为挂锤庄，庄资田产殷实富足，四位庄主天生神力，善用双锤，虽为人莽撞冲动，但却天性正直，平日对周边乡里也多有照顾。"
    translated: "Located in the western outskirts of ten miles from Licheng City in Xiangbei Prefecture, this manor was originally named Wu Family Manor. After four successive Manor Masters dedicated a decade to learning martial arts under a Daoist with the hanging hammer technique, they renamed it Hanging Hammer Manor. With abundant land and wealth, these four Manor Masters possessed extraordinary strength and excelled in using dual hammers. Although they were often rash and impulsive, their inherent honesty was evident. They also frequently helped the surrounding villages and towns."

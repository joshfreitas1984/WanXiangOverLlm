  - splitPath: Desc
    subIndex: 5
    text: "探索神女宫，随巫云凤找黑白无常报仇。"
    translated: "Explore the Shrine of the Divine Maiden, and accompany Wu Yunfeng to seek revenge on the King and Queen of Hell."
  - splitPath: Desc
    subIndex: 6
    text: "探索神女宫，受到巫云凤惩罚。"
    translated: "Exploring the Shrine of the Divine Maidens, I was punished by Wu Yunfeng."
  - splitPath: Desc
    subIndex: 7
    text: "探索神女宫，表白巫云凤，解锁神女宫。"
    translated: "Explore the Shrine of the Divine Maiden, confess to Wu Yunfeng, unlock the Shrine of the Divine Maiden."
  - splitPath: DetailDesc
    text: "位于川东夔州府巫山神女峰上，为百年前一位江湖奇女子所立，宫中上下皆为女子，平素极少与外界江湖往来，现任宫主巫云凤风华绝代，一身修为深不可测，宫内分设朝云、暮雨两司，分管宫中产业营生和消息收集。"
    translated: "Located atop Wushan's Goddess Peak in Kuizhou, Eastern Sichuan, this was established a hundred years ago by a remarkable lady of the Jianghu. The palace is home to all women, rarely interacting with the outside Jianghu. The current Palace Mistress, Wufeng Yun, is unparalleled in her beauty and prowess, with an incomprehensible level of cultivation. The palace is divided into two departments: Morning Cloud and Dusk Rain, overseeing the internal affairs and information gathering of the palace."
    qcReviewedText: "Located atop Wushan's Goddess Peak in Kuizhou, Eastern Sichuan, this was established a hundred years ago by a remarkable lady of the Jianghu. The palace is home to all women, rarely interacting with the outside Jianghu. The current Palace Mistress, Wufeng Yun, is unparalleled in her beauty and prowess, with an incomprehensible level of cultivation. The palace is divided into two departments: Morning Cloud and Dusk Rain, overseeing the internal affairs and information gathering of the palace."
    qcTranslated: "Located atop Goddess Peak in Wushan, Kuizhou Prefecture, Eastern Sichuan, this palace was established a hundred years ago by a remarkable woman of the Jianghu. All members of the palace are women, and they rarely interact with the outside Jianghu. The current Palace Mistress, Wu Yunfeng, is unparalleled in her beauty and prowess, with an incomprehensible level of cultivation. The palace is divided into two departments: Morning Cloud and Dusk Rain, overseeing the palace's business operations and information gathering."
    qcStatus: Corrected
    qcQualityScore: 82
    qcDefectCategory: OtherNamedDefect
  - splitPath: LockDesc
    text: "第六年一月开始，福缘到达120，探索川东遇到白开泰被惩治，再次探索川东遇到黑白无常埋伏巫云凤，向巫云凤报信，最后探索神女宫，将巫云凤护送回神女宫后，巫云凤闭关托付神女宫后开启。"
    translated: "Starting in January of the sixth year, Luck arrives at 120. During exploration in eastern Sichuan, Bai Kai Tai is punished. Revisiting eastern Sichuan, they encounter an ambush by the Black and White Immortals and send a message to Wu Yun Feng. Finally, exploring the Palace of the Goddess, Wu Yun Feng secludes herself and entrusts the Palace of the Goddess before opening it."
    qcReviewedText: "Starting in January of the sixth year, Luck arrives at 120. During exploration in eastern Sichuan, Bai Kai Tai is punished. Revisiting eastern Sichuan, they encounter an ambush by the Black and White Immortals and send a message to Wu Yun Feng. Finally, exploring the Palace of the Goddess, Wu Yun Feng secludes herself and entrusts the Palace of the Goddess before opening it."
    qcTranslated: "Starting in January of the sixth year, Luck arrives at 120.. During exploration in eastern Sichuan, Bai Kai Tai is punished. Revisiting eastern Sichuan, they encounter an ambush by the Black and White Immortals and send a message to Wu Yun Feng. Finally, exploring the Palace of the Goddess, escort Wu Yun Feng back to the Palace of the Goddess; after she secludes herself and entrusts the Palace of the Goddess, it opens."

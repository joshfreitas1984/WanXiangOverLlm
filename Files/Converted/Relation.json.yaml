    text: "第六年一月开始，万寿庄友好到达80，拥有老树根，可用老树根救治彭祖寿。探索荆东遇到澜沧商人开启荆南宝象阁，第七年时财富到达5000探索宝象阁可购买一根柔佛老树根，若第七年购买过柔佛老树根在其他地方已消耗，财富到达3000可再次探索宝象阁购买老树根。"
    translated: "Starting in the first month of the sixth year, Wan Shou Zhuang welcomes friendly visitors 80, who possess old tree roots that can be used to treat Peng Zushou. Exploring Jing Dong leads to encountering a Lancang merchant, which opens up Jing Nan Baoxiang Ge. By the seventh year, wealth reaches 5000. Exploring Baoxiang Ge allows you to purchase one Softold Tree Root. If in the seventh year you have already purchased the Softold Tree Root and it has been consumed elsewhere, reaching a wealth of 3000 will enable you to explore Baoxiang Ge again to purchase another old tree root."

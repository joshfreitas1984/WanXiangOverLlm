    subIndex: 9
    text: "可重复"
    translated: "Repeatable"
  - splitPath: DetailDesc
    text: "位于湘南永州府宁远县九嶷山深处，由永州捕蛇人组成，历经数代而创立，以毒术和牧蛇之术闻名，谷中门人多以牧蛇为业，亦善制多种秘药。谷主【食虺神君】蒋疠夫孤僻乖戾，出手狠辣，与江湖中人少有往来。"
    translated: "Located deep within Jiuyi Mountain in Ningyuan County of Yongzhou Prefecture, Xiangnan Province, this valley was founded by generations of snake catchers from Yongzhou. Renowned for its expertise in poison techniques and snake husbandry, most practitioners in the valley earn their living by tending to snakes, also excelling in creating various secret medicines. The Valley Master  【Serpent God】  Jiang Lifu is known for his reclusive and eccentric personality, as well as his ruthless actions; he has few interactions with people from the Jianghu."
    qcReviewedText: "Located deep within Jiuyi Mountain in Ningyuan County of Yongzhou Prefecture, Xiangnan Province, this valley was founded by generations of snake catchers from Yongzhou. Renowned for its expertise in poison techniques and snake husbandry, most practitioners in the valley earn their living by tending to snakes, also excelling in creating various secret medicines. The Valley Master  【Serpent God】  Jiang Lifu is known for his reclusive and eccentric personality, as well as his ruthless actions; he has few interactions with people from the Jianghu."
    qcStatus: Passed
    qcQualityScore: 100
    qcDefectCategory: None

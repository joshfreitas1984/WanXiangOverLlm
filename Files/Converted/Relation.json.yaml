    qcTranslated: "1. Unlock Xiao Xueyan as a Red Beauty, and obtain the Jade Pearl Zhonglou.\\n2. Unlock Shen Qinglu as a Red Beauty, and obtain the Red‑Patterned Peony.\\n3. Reach Wealth of 4000, explore the Fengdu Ghost Market in Eastern Sichuan, and purchase the Cold Peak Wintergreen.\\n4. Explore the Divine Maiden Palace and provide Wu Yunfeng with three rare herbs.\\n5. Explore the Divine Maiden Palace. The Three Gangs and Four Strongholds threaten the Divine Maiden Palace, and Wu Yunfeng emerges from seclusion to subdue them.\\n6. Explore the Divine Maiden Palace and accompany Wu Yunfeng to seek revenge on the Black and White Impermanence Kings.\\n7. Explore the Divine Maiden Palace and be punished by Wu Yunfeng.\\n8. Explore the Divine Maiden Palace, confess to Wu Yunfeng, and unlock the Divine Maiden Palace."

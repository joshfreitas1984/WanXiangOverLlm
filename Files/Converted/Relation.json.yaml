  - splitPath: DetailDesc
    text: "位于湘南郴州府永兴县北，由长孙诚创立，庄中弟子皆需修文练武，研习君子六艺，庄主【三湘君子】长孙诚乃是弘治朝传胪，温和儒雅，文武双全，荆湘各府世家望族多因仰慕其学识名望而让族中子弟拜入门下。"
    translated: "Located in Yongxing County, north of Xichun Prefecture in Xiangnan Province, this manor was founded by Zhangsun Cheng. All the disciples within the manor are required to study both literature and martial arts, mastering the Six Arts for gentlemen. Manor Master  【Three Provinces Gentleman】  Zhangsun Cheng is a top scholar from the Hongzhi era. They are gentle and scholarly, well‑versed in both literature and martial arts. They embody both literary and martial excellence. Many aristocratic families from various prefectures across Jingxiang frequently send their family members to be initiated into his manor due to their admiration for his scholarly reputation."
    qcReviewedText: "Located in Yongxing County, north of Xichun Prefecture in Xiangnan Province, this manor was founded by Zhangsun Cheng. All the disciples within the manor are required to study both literature and martial arts, mastering the Six Arts for gentlemen. Manor Master  【Three Provinces Gentleman】  Zhangsun Cheng is a top scholar from the Hongzhi era. They are gentle and scholarly, well‑versed in both literature and martial arts. They embody both literary and martial excellence. Many aristocratic families from various prefectures across Jingxiang frequently send their family members to be initiated into his manor due to their admiration for his scholarly reputation."
    qcTranslated: "Located in Yongxing County, north of Chenzhou Prefecture in Xiangnan, this manor was founded by Zhangsun Cheng. All disciples within the manor are required to study literature and practice martial arts, mastering the Six Arts of a gentleman. Manor Master 【Three Provinces Gentleman】 Zhangsun Cheng was a Tonglu from the Hongzhi era. He is gentle and refined, excelling in both literary and martial pursuits. Many prominent families from various prefectures across Jingxiang send their children to study under him out of admiration for his learning and reputation."
    qcStatus: Corrected
    qcQualityScore: 82
    qcDefectCategory: OtherNamedDefect

- raw: "{\r\n    \"Key\": \"1005\",\r\n    \"Name\": \"丐帮忠字舵\",\r\n    \"Desc\": \"①第四年一月起，厨艺到达40探索湘东可遇翁和仲邀请吃叫花鸡\\\\n②富贵巷开启后，探索富贵巷拜访翁和仲\\\\n③再次探访富贵巷听闻乌菟汤，第四年一月开始探索湘南可遇猛虎，战胜后可获得虎骨\\\\n④再次探索富贵巷听闻炙烤肉，厨艺到达入门，探索野猪林可遇野猪，战胜后可获得野猪后腿\\\\n⑤厨艺到达高手，丐帮忠字舵友好度到达80，探索富贵巷答题成功后翁和仲加入，解锁丐帮忠字舵\\\\n⑥探索富贵巷可向翁和仲学习厨艺\\\\n-可重复\",\r\n    \"DetailDesc\": \"位于湘东长沙府长沙城中，是丐帮八大分舵之一，统领荆楚一地丐帮弟子，门中弟子相互照应，虽以乞化为生，却不行不义之举，舵主【大肚奇丐】翁和仲开朗豁达，乐天知命，在丐帮各大长老中尤以厨艺闻名。\",\r\n    \"LockDesc\": \"第四年一月起，厨艺到达入门，探索湘东与翁和仲品尝叫花鸡后受邀开启。\\\\n与丐帮忠字舵友好度到达100解锁。\",\r\n    \"RepeatDesc\": \"探索富贵巷可向翁和仲学习厨艺。\",\r\n    \"GuidDescList\": [\r\n      \"第四年一月起，厨艺到达40探索湘东可遇翁和仲邀请吃叫花鸡。\",\r\n      \"探索富贵巷拜访翁和仲。\",\r\n      \"探访富贵巷听闻乌菟汤，第四年一月开始探索野猪林可遇猛虎，战胜后可获得虎骨。（若虎骨已消耗，再次探索野猪林可再次遇到猛虎）\",\r\n      \"再次探索富贵巷听闻炙烤肉，厨艺到达入门，探索野猪林可遇野猪，战胜后可获得野猪后腿。\",\r\n      \"厨艺到达高手，丐帮忠字舵友好度到达80，探索富贵巷答题成功后翁和仲加入，解锁丐帮忠字舵。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"丐幫忠字舵\",\r\n    \"DescTw\": \"①第四年一月起，廚藝到達40探索湘東可遇翁和仲邀請吃叫花雞\\\\n②富貴巷開啟後，探索富貴巷拜訪翁和仲\\\\n③再次探訪富貴巷聽聞烏菟湯，第四年一月開始探索湘南可遇猛虎，戰勝後可獲得虎骨\\\\n④再次探索富貴巷聽聞炙烤肉，廚藝到達入門，探索野豬林可遇野豬，戰勝後可獲得野豬後腿\\\\n⑤廚藝到達高手，丐幫忠字舵友好度到達80，探索富貴巷答題成功後翁和仲加入，解鎖丐幫忠字舵\\\\n⑥探索富貴巷可向翁和仲學習廚藝\\\\n-可重複\",\r\n    \"DetailDescTw\": \"位於湘東長沙府長沙城中，是丐幫八大分舵之一，統領荊楚一地丐幫弟子，門中弟子相互照應，雖以乞化為生，卻不行不義之舉，舵主【大肚奇丐】翁和仲開朗豁達，樂天知命，在丐幫各大長老中尤以廚藝聞名。\",\r\n    \"LockDescTw\": \"第四年一月起，廚藝到達入門，探索湘東與翁和仲品嚐叫花雞後受邀開啟。\\\\n與丐幫忠字舵友好度到達100解鎖。\",\r\n    \"RepeatDescTw\": \"探索富貴巷可向翁和仲學習廚藝。\",\r\n    \"GuidDescTwList\": [\r\n      \"第四年一月起，廚藝到達40探索湘東可遇翁和仲邀請吃叫花雞。\",\r\n      \"探索富貴巷拜訪翁和仲。\",\r\n      \"探訪富貴巷聽聞烏菟湯，第四年一月開始探索野豬林可遇猛虎，戰勝後可獲得虎骨。（若虎骨已消耗，再次探索野豬林可再次遇到猛虎）\",\r\n      \"再次探索富貴巷聽聞炙烤肉，廚藝到達入門，探索野豬林可遇野豬，戰勝後可獲得野豬後腿。\",\r\n      \"廚藝到達高手，丐幫忠字舵友好度到達80，探索富貴巷答題成功後翁和仲加入，解鎖丐幫忠字舵。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

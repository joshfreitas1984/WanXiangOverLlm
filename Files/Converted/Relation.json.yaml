- raw: "{\r\n    \"Key\": \"1014\",\r\n    \"Name\": \"神女宫\",\r\n    \"Desc\": \"①解锁萧雪雁红颜，并获得玉珠重楼。\\\\n②解锁沈青鸬红颜，并获得赤纹芍药。\\\\n③财富到达4000，探索川东丰都鬼市，购买寒峰冬青。\\\\n④探索神女宫，向巫云凤提供三株奇药。\\\\n⑤探索神女宫，三帮四寨威逼神女宫，巫云凤出关收服三帮四寨。\\\\n⑥探索神女宫，随巫云凤找黑白无常报仇。\\\\n⑦探索神女宫，受到巫云凤惩罚。\\\\n⑧探索神女宫，表白巫云凤，解锁神女宫。\",\r\n    \"DetailDesc\": \"位于川东夔州府巫山神女峰上，为百年前一位江湖奇女子所立，宫中上下皆为女子，平素极少与外界江湖往来，现任宫主巫云凤风华绝代，一身修为深不可测，宫内分设朝云、暮雨两司，分管宫中产业营生和消息收集。\",\r\n    \"LockDesc\": \"第六年一月开始，福缘到达120，探索川东遇到白开泰被惩治，再次探索川东遇到黑白无常埋伏巫云凤，向巫云凤报信，最后探索神女宫，将巫云凤护送回神女宫后，巫云凤闭关托付神女宫后开启。\",\r\n    \"RepeatDesc\": \"探索神女宫可选择巡查附属势力获得孝敬。\",\r\n    \"GuidDescList\": [\r\n      \"解锁萧雪雁红颜，并获得玉珠重楼。\",\r\n      \"解锁沈青鸬红颜，并获得赤纹芍药。\",\r\n      \"财富到达4000，探索川东丰都鬼市，购买寒峰冬青。\",\r\n      \"探索神女宫，向巫云凤提供三株奇药。\",\r\n      \"探索神女宫，三帮四寨威逼神女宫，巫云凤出关收服三帮四寨。\",\r\n      \"探索神女宫，随巫云凤找黑白无常报仇。\",\r\n      \"探索神女宫，受到巫云凤惩罚。\",\r\n      \"探索神女宫，表白巫云凤，解锁神女宫。\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"神女宮\",\r\n    \"DescTw\": \"①解鎖蕭雪雁紅顏，並獲得玉珠重樓。\\\\n②解鎖沈青鸕紅顏，並獲得赤紋芍藥。\\\\n③財富到達4000，探索川東豐都鬼市，購買寒峰冬青。\\\\n④探索神女宮，向巫雲鳳提供三株奇藥。\\\\n⑤探索神女宮，三幫四寨威逼神女宮，巫雲鳳出關收服三幫四寨。\\\\n⑥探索神女宮，隨巫雲鳳找黑白無常報仇。\\\\n⑦探索神女宮，受到巫雲鳳懲罰。\\\\n⑧探索神女宮，表白巫雲鳳，解鎖神女宮。\",\r\n    \"DetailDescTw\": \"位於川東夔州府巫山神女峰上，為百年前一位江湖奇女子所立，宮中上下皆為女子，平素極少與外界江湖往來，現任宮主巫雲鳳風華絕代，一身修為深不可測，宮內分設朝雲、暮雨兩司，分管宮中產業營生和訊息收集。\",\r\n    \"LockDescTw\": \"第六年一月開始，福緣到達120，探索川東遇到白開泰被懲治，再次探索川東遇到黑白無常埋伏巫雲鳳，向巫雲鳳報信，最後探索神女宮，將巫雲鳳護送回神女宮後，巫雲鳳閉關託付神女宮後開啟。\",\r\n    \"RepeatDescTw\": \"探索神女宮可選擇巡查附屬勢力獲得孝敬。\",\r\n    \"GuidDescTwList\": [\r\n      \"解鎖蕭雪雁紅顏，並獲得玉珠重樓。\",\r\n      \"解鎖沈青鸕紅顏，並獲得赤紋芍藥。\",\r\n      \"財富到達4000，探索川東豐都鬼市，購買寒峰冬青。\",\r\n      \"探索神女宮，向巫雲鳳提供三株奇藥。\",\r\n      \"探索神女宮，三幫四寨威逼神女宮，巫雲鳳出關收服三幫四寨。\",\r\n      \"探索神女宮，隨巫雲鳳找黑白無常報仇。\",\r\n      \"探索神女宮，受到巫雲鳳懲罰。\",\r\n      \"探索神女宮，表白巫雲鳳，解鎖神女宮。\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

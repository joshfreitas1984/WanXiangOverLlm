  - splitPath: DetailDesc
    text: "位于川南叙州府大凉山北麓，乃是三苗后裔、蚩尤血脉传人，峒中世传驯养苍狼之术，峒主【九黎苍首】蚩连，为川蜀诸峒第一驯兽高手，蚩黎寨民平日自耕自渔，尤以苍狼狩猎为长，少与中原城镇来往。"
    translated: "Located in the northern foothills of Daliang Mountain in Xuzhou Prefecture, Sichuan South, it is home to the descendants of the ancient Miaofu people and the descendants of Chiyou. The Dungong has a tradition of taming and training blue wolves, passed down through generations. The Dungong chief, Nine‑Li Cangshou Chi Lian, is the top expert in animal taming among the various Dungong in Sichuan and Sichuan Province. The residents of Chi Li Village primarily engage in self‑cultivation and fishing, excelling particularly in blue wolf hunting, and rarely interact with towns in the Central Plains."
    qcReviewedText: "Located in the northern foothills of Daliang Mountain in Xuzhou Prefecture, Sichuan South, it is home to the descendants of the ancient Miaofu people and the descendants of Chiyou. The Dungong has a tradition of taming and training blue wolves, passed down through generations. The Dungong chief, Nine‑Li Cangshou Chi Lian, is the top expert in animal taming among the various Dungong in Sichuan and Sichuan Province. The residents of Chi Li Village primarily engage in self‑cultivation and fishing, excelling particularly in blue wolf hunting, and rarely interact with towns in the Central Plains."

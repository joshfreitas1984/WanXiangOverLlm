    text: "位于荆东武昌府蒲圻县内，由彭祖寿创立，帮中辖下产业颇多，店铺、田产皆有涉及，遍及武昌五县之地，是荆东第一大帮。帮主【百福翁】彭祖寿年近百岁，老迈昏聩，一心只求收集天下奇珍宝药益寿延年。"
    translated: "Located in Puyi County within Wuchang Prefecture, Jingdong Province, this gang was founded by Peng Zushou. The gang's operations are extensive, involving shops and farmlands, spanning across five counties of Wuchang. It is the largest gang in Jingdong. Gang Leader  【Blessed Abundance Old Man】  Peng Zushou is nearly a hundred years old, frail and senile, with his sole desire being to gather all manner of rare treasures and medicinal herbs for longevity."
    qcReviewedText: "Located in Puyi County within Wuchang Prefecture, Jingdong Province, this gang was founded by Peng Zushou. The gang's operations are extensive, involving shops and farmlands, spanning across five counties of Wuchang. It is the largest gang in Jingdong. Gang Leader  【Blessed Abundance Old Man】  Peng Zushou is nearly a hundred years old, frail and senile, with his sole desire being to gather all manner of rare treasures and medicinal herbs for longevity."

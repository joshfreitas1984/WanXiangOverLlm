- raw: "{\r\n    \"Key\": \"1009\",\r\n    \"Name\": \"挂锤庄\",\r\n    \"Desc\": \"①第四年一月起，探索荆北选择去春风楼看热闹战胜挂锤四猛\\\\n②探索湘北挂锤庄，得知挂锤四猛的师承\\\\n③挂锤庄友好到达40，探索湘北帮助挂锤四猛战胜洪十四\\\\n④探索挂锤装可锻炼体魄\\\\n-可重复\\\\n⑤第五年一月起，探索荆北，击杀洪十四。\\\\n⑥第八年一月起，挂锤庄友好到达80，探索荆北，从衍劫手中救下符天罡，符天罡加入，解锁挂锤庄。\",\r\n    \"DetailDesc\": \"位于湘北澧州府澧州城西十里外，本名武家庄，后四位庄主为纪念道人十年挂锤传艺之恩将其改为挂锤庄，庄资田产殷实富足，四位庄主天生神力，善用双锤，虽为人莽撞冲动，但却天性正直，平日对周边乡里也多有照顾。\",\r\n    \"LockDesc\": \"第四年一月起，探索荆北选择去春风楼看热闹战胜挂锤四猛开启挂锤庄。\\\\n与挂锤帮友好度到达100解锁。\",\r\n    \"RepeatDesc\": \"探索挂锤庄可锻炼体魄\",\r\n    \"GuidDescList\": [\r\n      \"第四年一月起，探索荆北选择去春风楼看热闹战胜挂锤四猛开启挂锤庄。\",\r\n      \"探索湘北挂锤庄，得知挂锤四猛的师承。\",\r\n      \"挂锤庄友好到达40，探索湘北帮助挂锤四猛战胜洪十四。\",\r\n      \"第五年一月起，探索荆北，击杀洪十四。\",\r\n      \"第八年一月起，挂锤庄友好到达80，探索荆北，从衍劫手中救下符天罡，符天罡加入，解锁挂锤庄。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"掛錘莊\",\r\n    \"DescTw\": \"①第四年一月起，探索荊北選擇去春風樓看熱鬧戰勝掛錘四猛\\\\n②探索湘北掛錘莊，得知掛錘四猛的師承\\\\n③掛錘莊友好到達40，探索湘北幫助掛錘四猛戰勝洪十四\\\\n④探索掛錘裝可鍛鍊體魄\\\\n-可重複\\\\n⑤第五年一月起，探索荊北，擊殺洪十四。\\\\n⑥第八年一月起，掛錘莊友好到達80，探索荊北，從衍劫手中救下符天罡，符天罡加入，解鎖掛錘莊。\",\r\n    \"DetailDescTw\": \"位於湘北澧州府澧州城西十里外，本名武家莊，後四位莊主為紀念道人十年掛錘傳藝之恩將其改為掛錘莊，莊資田產殷實富足，四位莊主天生神力，善用雙錘，雖為人莽撞衝動，但卻天性正直，平日對周邊鄉里也多有照顧。\",\r\n    \"LockDescTw\": \"第四年一月起，探索荊北選擇去春風樓看熱鬧戰勝掛錘四猛開啟掛錘莊。\\\\n與掛錘幫友好度到達100解鎖。\",\r\n    \"RepeatDescTw\": \"探索掛錘莊可鍛鍊體魄\",\r\n    \"GuidDescTwList\": [\r\n      \"第四年一月起，探索荊北選擇去春風樓看熱鬧戰勝掛錘四猛開啟掛錘莊。\",\r\n      \"探索湘北掛錘莊，得知掛錘四猛的師承。\",\r\n      \"掛錘莊友好到達40，探索湘北幫助掛錘四猛戰勝洪十四。\",\r\n      \"第五年一月起，探索荊北，擊殺洪十四。\",\r\n      \"第八年一月起，掛錘莊友好到達80，探索荊北，從衍劫手中救下符天罡，符天罡加入，解鎖掛錘莊。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

  - splitPath: Desc
    text: "探索川南，答应蚩萤送回小福。"
    translated: "Explore Southern Sichuan and promise Chi Ying that you will return Xiao Fu to her."
    qcReviewedText: "①Explore Southern Sichuan and promise Chi Ying that you will return Xiao Fu to her.\\n②Exploring Daliang Mountain, I returned Xiao Fu to the bamboo grove at the back of Daliang Mountain, where Da Fu entrusted Xiao Fu to me again.\\n③After obtaining Xiao Fu, explore Chili Dong and visit Chili Lian.\\n④Wealth reached 500, explore Western Sichuan, and accompany Chiyu and Xiaofu on a tour of Chengdu City.\\n⑤Starting in January of the sixth year, explore eastern Sichuan, rest at the dilapidated temple, and Xiao Fu feels that his mother, Da Fu, is in danger.\\n⑥Explore Daliang Mountain, defeat the Five Senses King Yin Bopi, and save Dafu.\\n⑦Exploring Daliang Mountain, Da Fu helps you and Chili to seal your fate, unlocking Qiying."
    qcTranslated: "1. Explore Southern Sichuan and promise Chi Ying that you will return Xiao Fu to her.\\n2. Explore Daliang Mountain, return Xiao Fu to the bamboo grove at the back of Daliang Mountain, and be entrusted with Xiao Fu again by Da Fu.\\n3. After obtaining Xiao Fu, explore Chili Dong and visit Chili Lian.\\n4. Once Wealth reaches 500, explore Western Sichuan and accompany Chi Ying and Xiao Fu on a tour of Chengdu City.\\n5. Starting in January of the sixth Year, explore Eastern Sichuan, rest at the dilapidated temple, and Xiao Fu senses that his mother, Da Fu, is in danger.\\n6. Explore Daliang Mountain, defeat the Five Senses King Yin Bopi, and save Da Fu.\\n7. Explore Daliang Mountain; Da Fu helps you and Chi Li form a bond of fate, unlocking Chi Ying."
    qcStatus: Corrected
    qcQualityScore: 82
    qcDefectCategory: DroppedContent

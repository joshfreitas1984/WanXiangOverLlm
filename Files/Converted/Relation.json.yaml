  - splitPath: DetailDesc
    text: "位于川中顺庆府南充城中，统领川蜀一众六扇门衙门，负责管理川蜀地区江湖人所犯案件，总捕头【网开一面】樊重关经验老到，雷厉风行，自上任以来，便率领衙中高手擒拿了无数江湖败类。"
    translated: "Located in the city of Nanchong in the Southern Sichuan Prefecture of Zhungeqing, North Sichuan, the Six Doors headquarters oversees the management of criminal cases involving the Jianghu in the Sichuan region. Chief Inspector Wan Kaigen, with his seasoned and decisive approach, has since his appointment apprehended countless scoundrels from the Jianghu."
    qcReviewedText: "Located in the city of Nanchong in the Southern Sichuan Prefecture of Zhungeqing, North Sichuan, the Six Doors headquarters oversees the management of criminal cases involving the Jianghu in the Sichuan region. Chief Inspector Wan Kaigen, with his seasoned and decisive approach, has since his appointment apprehended countless scoundrels from the Jianghu."
    qcTranslated: "Located in Nanchong City, Shunqing Prefecture, Central Sichuan, the Six Doors headquarters oversees all Six Doors offices in Sichuan and Shu, managing cases committed by Jianghu figures in the region. Chief Inspector Fan Zhongguan, known as The Magnanimous, is experienced and decisive; since taking office, he has led his top experts in apprehending countless Jianghu scoundrels."
    qcStatus: Corrected
    qcQualityScore: 82
    qcDefectCategory: OtherNamedDefect

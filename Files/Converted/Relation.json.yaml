    text: "位于川西成都府成都城南三十里外，乃三百年前一位江湖奇女所创，所传剑法优雅飘逸，观之令人心旷神怡，其名声虽不显于江湖，但数百年来，始终护佑一方，被四乡百姓敬若神明，皆以家中后辈能拜入浣花派为荣。"
    translated: "Located thirty miles south of Chengdu City in Western Sichuan, this martial arts style was created three hundred years ago by a remarkable woman of the Jianghu. The techniques passed down are graceful and elegant, offering a visual treat that leaves one feeling refreshed and at ease. Though not widely renowned in the Jianghu, the sect has protected its territory for centuries, revered by the local populace as if it were a deity. Being able to join the Wenhuashan Sect is considered a source of pride for the families of the surrounding villages."

  - splitPath: DetailDesc
    text: "位于湘东长沙府岳麓山脚下，创立于北宋开宝年间，天下四大书院之一，汇集以“道林四友”为首的一众博学夫子，是荆湘的文坛圣地。山长【麓山先生】荀师道高风亮节，满腹经纶，是天下闻名的博雅大儒。"
    translated: "Located at the foot of Yuelu Mountain in Xiangdong's Changsha Prefecture, and founded during the early years of Emperor Taizong's reign in the Northern Song Dynasty, it is one of the Four Great Academies of China. Known as 'The Academy of Dawlin,' it gathers a multitude of erudite scholars, including the Four Friends of Dawlin. This academy stands as a holy site for literature in Jingxiang. The headmaster, Mr. Lushan Xun Shida, is renowned for his high moral character and extensive knowledge, being celebrated as one of the world's great erudite sages."
    qcReviewedText: "Located at the foot of Yuelu Mountain in Xiangdong's Changsha Prefecture, and founded during the early years of Emperor Taizong's reign in the Northern Song Dynasty, it is one of the Four Great Academies of China. Known as 'The Academy of Dawlin,' it gathers a multitude of erudite scholars, including the Four Friends of Dawlin. This academy stands as a holy site for literature in Jingxiang. The headmaster, Mr. Lushan Xun Shida, is renowned for his high moral character and extensive knowledge, being celebrated as one of the world's great erudite sages."

    text: "探索神农谷将柔佛老树根赠与连山谷种植长生稻，完成连翘儿第二个愿望。第七年一月开始，财富到达五千，探索荆东开启荆南宝象阁后，从宝象阁购买，第一个老树根消耗后，财富到达三千，可在探索宝象阁再次购买老树根。"
    translated: "Explore Shennong Valley and gift the Soft Old Tree Root to Lian Shangu to plant Immortality Rice, fulfilling Lian Qiaoer's second wish. Starting in January of the seventh year, wealth reaches five thousand. After exploring Jingdong and opening Jinsouth's Treasure Image Pavilion, you can purchase the old tree root from the Treasure Image Pavilion after consuming the first one, which will bring your wealth down to three thousand. You can then explore the Treasure Image Pavilion again to buy another old tree root."

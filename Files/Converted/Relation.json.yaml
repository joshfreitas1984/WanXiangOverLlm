    qcReviewedText: "①Explore the Huanhua Study and visit Gao Chunfeng.\\n②The friendly Huanhua Sect has arrived at 20. To explore the Huanhua Pavilion, choose to seek martial arts guidance from Gao Chunfeng and defeat Gao Chunfeng, who has Power three successes.\\n③Huanhua Sect has arrived at 40. To explore Huanhua Pavilion, choose to seek martial arts guidance from Gao Chunfeng and defeat a Gao Chunfeng with 50% Power.\\n④The Huanhua Sect has arrived at 60. To explore the Huanhua Pavilion, choose to seek martial arts guidance from Gao Chunfeng and defeat him; he possesses seventy percent of your Power.\\n⑤After unlocking Red Beauty Shao Qinghong, the Huanhua Sect becomes friendly towards 80. Exploring the Huanhua Pavilion and choosing to seek martial arts guidance from Gao Chunfeng leads to defeating Gao Chunfeng at full strength, unlocking the Huanhua Sect.\\n⑥Exploring the Huanhua Sect allows you to spar with Huanhua disciples to enhance your Potential.\\n-Repeatable"

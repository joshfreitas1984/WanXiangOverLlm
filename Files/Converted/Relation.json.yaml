- raw: "{\r\n    \"Key\": \"6\",\r\n    \"Name\": \"连翘儿\",\r\n    \"Desc\": \"①探索荆东酒楼服下连翘儿的七香豆\\\\n②探索荆北神农谷带着连翘儿向连山谷请罪\\\\n③任意一年四月探索神农谷遇到金枝连翘开花，得知连翘儿有三个愿望，连翘花开第一个愿望\\\\n④探索荆东遇到澜沧商人开启荆南宝象阁，第七年时财富到达5000探索宝象阁购买柔佛老树根，探索神农谷将柔佛老树根赠与连山谷种植长生稻，完成连翘儿第二个愿望。若购买过柔佛老树根并在其他地方已消耗，财富到达3000可再次探索宝象阁购买老树根。\\\\n⑤探索神农谷将柔佛老树根赠与连山谷种植长生稻，完成连翘儿第二各愿望\\\\n⑥探索神农谷得知连翘儿第三愿望并完成，解锁连翘儿红颜\",\r\n    \"LockDesc\": \"第四年一月起，探索荆东，在街市遇到连翘儿后，再次探索荆东，帮助连翘儿战胜抓她的江湖人后结识。\",\r\n    \"GuidDescList\": [\r\n      \"探索荆东酒楼服下连翘儿的七香豆。\",\r\n      \"探索荆北神农谷带着连翘儿向连山谷请罪\",\r\n      \"任意一年四月探索神农谷遇到金枝连翘开花，得知连翘儿有三个愿望，连翘花开第一个愿望。\",\r\n      \"探索荆东遇到澜沧商人开启荆南宝象阁，第七年时财富到达5000探索宝象阁购买柔佛老树根，探索神农谷将柔佛老树根赠与连山谷种植长生稻，完成连翘儿第二个愿望。若购买过柔佛老树根在其他地方已消耗，财富到达3000可再次探索宝象阁购买老树根。\",\r\n      \"探索神农谷得知连翘儿第三愿望并完成，解锁连翘儿红颜。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"連翹兒\",\r\n    \"DescTw\": \"①探索荊東酒樓服下連翹兒的七香豆\\\\n②探索荊北神農谷帶著連翹兒向連山谷請罪\\\\n③任意一年四月探索神農谷遇到金枝連翹開花，得知連翹兒有三個願望，連翹花開第一個願望\\\\n④探索荊東遇到瀾滄商人開啟荊南寶象閣，第七年時財富到達5000探索寶象閣購買柔佛老樹根，探索神農谷將柔佛老樹根贈與連山谷種植長生稻，完成連翹兒第二個願望。若購買過柔佛老樹根並在其他地方已消耗，財富到達3000可再次探索寶象閣購買老樹根。\\\\n⑤探索神農谷將柔佛老樹根贈與連山谷種植長生稻，完成連翹兒第二各願望\\\\n⑥探索神農谷得知連翹兒第三願望並完成，解鎖連翹兒紅顏\",\r\n    \"LockDescTw\": \"第四年一月起，探索荊東，在街市遇到連翹兒後，再次探索荊東，幫助連翹兒戰勝抓她的江湖人後結識。\",\r\n    \"GuidDescTwList\": [\r\n      \"探索荊東酒樓服下連翹兒的七香豆。\",\r\n      \"探索荊北神農谷帶著連翹兒向連山谷請罪\",\r\n      \"任意一年四月探索神農谷遇到金枝連翹開花，得知連翹兒有三個願望，連翹花開第一個願望。\",\r\n      \"探索荊東遇到瀾滄商人開啟荊南寶象閣，第七年時財富到達5000探索寶象閣購買柔佛老樹根，探索神農谷將柔佛老樹根贈與連山谷種植長生稻，完成連翹兒第二個願望。若購買過柔佛老樹根在其他地方已消耗，財富到達3000可再次探索寶象閣購買老樹根。\",\r\n      \"探索神農谷得知連翹兒第三願望並完成，解鎖連翹兒紅顏。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

  - splitPath: Desc
    text: "拜师衡山派君子庄开启后，探索君子庄拜访长孙诚，结识长孙玉"
    translated: "After becoming an apprentice to the Hengshan Sect and opening Gentlemen Manor, explore Gentlemen Manor to visit Zhangsun Cheng and meet Zhangsun Yu."
    qcReviewedText: "①After becoming an apprentice to the Hengshan Sect and opening Gentlemen Manor, explore Gentlemen Manor to visit Zhangsun Cheng and meet Zhangsun Yu.②From January of the fourth year to December of the sixth year, explore Xiangnan and rescue Zhangsun Yu from Le Beifeng's hands.③In the seventh year, after automatically triggering the event of delivering tea to Zhangsun Cheng at Gentlemen Manor in April, up until July of the seventh year, Gentlemen Manor's friendship level reaches 60. Exploring Xiangnan twice reveals the Peaceful King's conspiracy.④In August of the seventh year, explore Gentlemen Manor again. Friendly arrival at 80. Uncover Jia Gushan's conspiracy. After defeating Jia Gushan, Medicine reaches expert level. On another exploration of Gentlemen Manor, Zhangsun Cheng joins. Unlock Gentlemen Manor.⑤Exploring Gentlemen Manor allows you to study Confucian Studies, Musical Arts, Divination, and Calligraphy from Zhangsun Cheng.\\n-Repeatable"
    qcTranslated: "1. After becoming an apprentice to the Hengshan Sect and opening Gentlemen Manor, explore Gentlemen Manor to visit Zhangsun Cheng and meet Zhangsun Yu.2. From January of the fourth year to December of the sixth year, explore Xiangnan and rescue Zhangsun Yu from Le Beifeng's hands.3. In the seventh year, after automatically triggering the event of delivering tea to Zhangsun Cheng at Gentlemen Manor in April, up until July of the seventh year, Gentlemen Manor's friendship level reaches 60.. Exploring Xiangnan twice reveals the Peaceful King's conspiracy.4. In August of the seventh year, explore Gentlemen Manor again. Once Gentlemen Manor's friendship level reaches 80., uncover Jia Gushan's conspiracy. After defeating Jia Gushan, Medicine reaches expert level. On another exploration of Gentlemen Manor, Zhangsun Cheng joins. Unlock Gentlemen Manor.5. Exploring Gentlemen Manor allows you to study Confucian Studies, Musical Arts, Divination, and Calligraphy from Zhangsun Cheng.\\n‑Repeatable"
    qcStatus: Corrected
    qcQualityScore: 82
    qcDefectCategory: HardToParseSeam

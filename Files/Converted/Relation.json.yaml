    qcTranslated: "Located ten miles west of Licheng City in Xiangbei Prefecture, this manor was originally named Wu Family Manor. To commemorate the Daoist's ten years of hanging his hammer to teach them martial arts, the four Manor Masters renamed it Hanging Hammer Manor. With abundant land and wealth, these four Manor Masters possessed extraordinary strength and excelled in using dual hammers. Although they were often rash and impulsive, their inherent honesty was evident. They also frequently helped the surrounding villages and towns."

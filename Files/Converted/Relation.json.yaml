    text: "位于荆东武昌府武昌城西，传至今日已有四代，是荆湘一地最大的镖局，其镖运业务南至岭南，北达关陇，在江湖中颇有声名。总镖头【打虎太岁】祖南雄虽好名自负，但亦豪爽大气，深得手下一众镖头、镖师的信赖。"
    translated: "Located in the western part of Wuchang City on the eastern bank of Jing River, this yao ju has been passed down for four generations and is the largest in the Jingxiang region. Its courier services extend south to Lingnan and north to Guanxi and Gansu, earning them a notable reputation in the Jianghu. Though the Chief Escort 'Wealthy Tiger‑Slaying God' Zu Nanxiong is vain and self‑aggrandizing, he is also generous and straightforward, winning the trust of his subordinates, including the various escort chiefs and couriers."

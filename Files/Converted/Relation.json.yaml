  - splitPath: DetailDesc
    text: "位于川西成都府成都城南三十里外，于汉昭烈庙中，一庙双祀，香火鼎盛，是姜氏后人护佑诸葛武侯支脉的存身之所，两家继承了武侯诸葛亮与其妻黄月英的机关匠造之术，庙祝姜云奎虽精通机关巧技，但却从不显露身手。"
    translated: "Located thirty miles south of Chengdu City in the western Sichuan Province, within the Han Zhao Li Temple, this temple houses two deities under one roof, with abundant incense offerings. It is a place where the descendants of the Jiang family protect a branch of Zhuge Liang, the renowned strategist. Both the Jiang and the Li families inherited Zhuge Liang and his wife Huang Yueying's skills in constructing mechanical devices. Though temple caretaker Jiang Yunkui is well‑versed in the intricate workings of these mechanisms, he never demonstrates his abilities."

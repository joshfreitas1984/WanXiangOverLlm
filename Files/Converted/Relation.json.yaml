  - splitPath: Desc
    text: "连翘儿加入后探索神农谷拜访连山谷"
    translated: "Lian Qiaoer joins and explores Shen Nong Valley to visit Lian Shangu."
    qcReviewedText: "①Lian Qiaoer joins and explores Shen Nong Valley to visit Lian Shangu.\\n②Exploring Shen Nong Valley when Golden Branch Forsythia blooms in any April, you learn that Lian Qiaoer has three wishes. The first wish is fulfilled when the Forsythia blooms.\\n③Starting from January of the seventh year, when wealth reaches five thousand, exploration of Jingdong unlocks Jingnan Baixiang Pavilion. After purchasing the first old tree root from the Baixiang Pavilion and spending it, wealth drops to three thousand, but you can purchase more old tree roots during subsequent explorations of the Baixiang Pavilion.\\n④Explore Shen Nong Valley and present the tender Jiaobei tree roots to Lian Shangu for planting the immortal rice, fulfilling Lian Qiaoer's second wish.\\n⑤Discover Lian Qiaoer's third wish in Shen Nong Valley and fulfill it.⑥Explore Shennong Valley again to visit Lian Shangu, consume the Elixir Rice, and have Lian Shangu join you, unlocking the Shennong Sect.⑥Exploring Shen Nong Valley allows you to learn Medicine from Lian Shangu.\\n-Repeatable"
    qcTranslated: "1. Lian Qiaoer joins and explores Shen Nong Valley to visit Lian Shangu.\\n2. Exploring Shen Nong Valley when Golden Branch Forsythia blooms in any April, you learn that Lian Qiaoer has three wishes. The first wish is fulfilled when the Forsythia blooms.\\n3. Starting from January of the seventh year, when Wealth reaches five thousand, exploration of Jingdong unlocks Jingnan Baixiang Pavilion. After purchasing the first old tree root from the Baixiang Pavilion and spending it, Wealth drops to three thousand, but you can purchase more old tree roots during subsequent explorations of the Baixiang Pavilion.\\n4. Explore Shen Nong Valley and present the Soft Jiaobei tree roots to Lian Shangu for planting the immortal rice, fulfilling Lian Qiaoer's second wish.\\n5. Discover Lian Qiaoer's third wish in Shen Nong Valley and fulfill it. 6. Explore Shen Nong Valley again to visit Lian Shangu, consume the Elixir Rice, and have Lian Shangu join you, unlocking the Shennong Sect. 7. Exploring Shen Nong Valley allows you to learn Medicine from Lian Shangu.\\n‑Repeatable"
    qcStatus: Corrected
    qcQualityScore: 88
    qcDefectCategory: DroppedContent
  - splitPath: Desc
    subIndex: 1
    text: "任意一年四月探索神农谷遇到金枝连翘开花，得知连翘儿有三个愿望，连翘花开第一个愿望"
    translated: "Exploring Shen Nong Valley when Golden Branch Forsythia blooms in any April, you learn that Lian Qiaoer has three wishes. The first wish is fulfilled when the Forsythia blooms."
  - splitPath: Desc
    subIndex: 2
    text: "第七年一月开始，财富到达五千，探索荆东开启荆南宝象阁后，从宝象阁购买，第一个老树根消耗后，财富到达三千，可在探索宝象阁再次购买老树根。"
    translated: "Starting from January of the seventh year, when wealth reaches five thousand, exploration of Jingdong unlocks Jingnan Baixiang Pavilion. After purchasing the first old tree root from the Baixiang Pavilion and spending it, wealth drops to three thousand, but you can purchase more old tree roots during subsequent explorations of the Baixiang Pavilion."
  - splitPath: Desc
    subIndex: 3
    text: "探索神农谷将柔佛老树根赠与连山谷种植长生稻，完成连翘儿第二个愿望"
    translated: "Explore Shen Nong Valley and present the tender Jiaobei tree roots to Lian Shangu for planting the immortal rice, fulfilling Lian Qiaoer's second wish."
  - splitPath: Desc
    subIndex: 4
    text: "探索神农谷得知连翘儿第三个愿望并完成"
    translated: "Discover Lian Qiaoer's third wish in Shen Nong Valley and fulfill it."
  - splitPath: Desc
    subIndex: 5
    text: "探索神农谷再次拜访连山谷，服用长生稻，连山谷加入，解锁神农帮"
    translated: "Explore Shennong Valley again to visit Lian Shangu, consume the Elixir Rice, and have Lian Shangu join you, unlocking the Shennong Sect."
  - splitPath: Desc
    subIndex: 6
    text: "探索神农谷可向连山谷学习医术"
    translated: "Exploring Shen Nong Valley allows you to learn Medicine from Lian Shangu."
  - splitPath: Desc
    subIndex: 7
    text: "可重复"
    translated: "Repeatable"
  - splitPath: DetailDesc
    text: "位于荆北郧阳府神农架中，由郧阳一带药农所组成，凭着历经数代所创的药谷之术闻名，谷中门人多以采药和种植药谷为业。谷主【九指神农】连山谷宽和慷慨，温厚敦良，一生执着于培育出前人所记载的“长生稻”。"
    translated: "Located in the northern part of Jing Province, within the Shennongjia region, Nine‑Fingered Shen Nong Lian Shangu and his followers form a community composed of local herbalists from Yunyang. Known for their pharmacological techniques passed down through generations, many disciples within the valley engage in herb gathering and cultivating medicinal herbs. The valley's master,  【Nine‑Fingered Shen Nong】  Lian Shangu, is generous and kind‑hearted, dedicated his entire life to breeding what was recorded as  “Eternal Life Rice” ."
    qcReviewedText: "Located in the northern part of Jing Province, within the Shennongjia region, Nine‑Fingered Shen Nong Lian Shangu and his followers form a community composed of local herbalists from Yunyang. Known for their pharmacological techniques passed down through generations, many disciples within the valley engage in herb gathering and cultivating medicinal herbs. The valley's master,  【Nine‑Fingered Shen Nong】  Lian Shangu, is generous and kind‑hearted, dedicated his entire life to breeding what was recorded as  “Eternal Life Rice” ."
    qcTranslated: "Located in the Shennongjia region of Yunyang Prefecture in northern Jing, composed of herbalists from the Yunyang area, the sect is renowned for its Valley Medicine techniques created over several generations. Most disciples in the valley make a living by gathering herbs and cultivating medicinal plants. The Valley Master, 【Nine‑Fingered Shen Nong】 Lian Shangu, is gentle, generous, warm, and kind‑hearted, having dedicated his entire life to cultivating the Eternal Life Rice recorded by his predecessors."
    qcStatus: Corrected
    qcQualityScore: 82
    qcDefectCategory: DroppedContent

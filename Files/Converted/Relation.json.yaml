    text: "位于湘北岳州府巴陵城中，统领荆湘一众六扇门衙门，负责管理荆湘地区江湖人所犯案件，总捕头【铁面判官】游不归刚正不阿，嫉恶如仇，遇到贼犯总是身先于众，一年中倒是少有几日在六扇门衙门中坐镇。"
    translated: "In Xiangbei's Yuezhou Prefecture, Balin City, Iron‑Faced Judge You Bugui, the overall commander of the Six Gates' offices in Jingxiang, is responsible for managing cases involving Jianghu people. Known for his integrity and his hatred of evil, he always leads from the front when dealing with criminals. In a year, he rarely spends more than a few days at the Six Doors' office."

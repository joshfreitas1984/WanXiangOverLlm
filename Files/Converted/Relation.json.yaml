- raw: "{\r\n    \"Key\": \"1015\",\r\n    \"Name\": \"川蜀六扇门\",\r\n    \"Desc\": \"①拜访川中川蜀六扇门，拜见樊重关。\\\\n②第五年一月开始，且完成过一次川蜀六扇门抓捕悬赏，探索六扇门得知盗粮三鼠在川南，将其三人抓获。\\\\n③探索川蜀六扇门得知盗粮三鼠被杀。\\\\n④第六年一月开始，且川蜀六扇门好感到达60，探索川中，战胜富贵杀手。\\\\n⑤探索川蜀六扇门，揭露况天龙并战胜，解锁川蜀六扇门。\",\r\n    \"DetailDesc\": \"位于川中顺庆府南充城中，统领川蜀一众六扇门衙门，负责管理川蜀地区江湖人所犯案件，总捕头【网开一面】樊重关经验老到，雷厉风行，自上任以来，便率领衙中高手擒拿了无数江湖败类。\",\r\n    \"LockDesc\": \"探索川中，遇到盗粮三鼠围攻方刚，吓退三人后开启。\",\r\n    \"RepeatDesc\": \"探索六扇门可接取悬赏通缉任务-数量有限。\",\r\n    \"GuidDescList\": [\r\n      \"拜访川中川蜀六扇门，拜见樊重关。\",\r\n      \"第五年一月开始，且完成过一次川蜀六扇门抓捕悬赏，探索六扇门得知盗粮三鼠在川南，将其三人抓获。\",\r\n      \"探索川蜀六扇门得知盗粮三鼠被杀。\",\r\n      \"第六年一月开始，且川蜀六扇门好感到达60，探索川中，战胜富贵杀手。\",\r\n      \"探索川蜀六扇门，揭露况天龙并战胜，解锁川蜀六扇门。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"川蜀六扇門\",\r\n    \"DescTw\": \"①拜訪川中川蜀六扇門，拜見樊重關。\\\\n②第五年一月開始，且完成過一次川蜀六扇門抓捕懸賞，探索六扇門得知盜糧三鼠在川南，將其三人抓獲。\\\\n③探索川蜀六扇門得知盜糧三鼠被殺。\\\\n④第六年一月開始，且川蜀六扇門好感到達60，探索川中，戰勝富貴殺手。\\\\n⑤探索川蜀六扇門，揭露況天龍並戰勝，解鎖川蜀六扇門。\",\r\n    \"DetailDescTw\": \"位於川中順慶府南充城中，統領川蜀一眾六扇門衙門，負責管理川蜀地區江湖人所犯案件，總捕頭【網開一面】樊重關經驗老到，雷厲風行，自上任以來，便率領衙中高手擒拿了無數江湖敗類。\",\r\n    \"LockDescTw\": \"探索川中，遇到盜糧三鼠圍攻方剛，嚇退三人後開啟。\",\r\n    \"RepeatDescTw\": \"探索六扇門可接取懸賞通緝任務-數量有限。\",\r\n    \"GuidDescTwList\": [\r\n      \"拜訪川中川蜀六扇門，拜見樊重關。\",\r\n      \"第五年一月開始，且完成過一次川蜀六扇門抓捕懸賞，探索六扇門得知盜糧三鼠在川南，將其三人抓獲。\",\r\n      \"探索川蜀六扇門得知盜糧三鼠被殺。\",\r\n      \"第六年一月開始，且川蜀六扇門好感到達60，探索川中，戰勝富貴殺手。\",\r\n      \"探索川蜀六扇門，揭露況天龍並戰勝，解鎖川蜀六扇門。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

- raw: "{\r\n    \"Key\": \"1001\",\r\n    \"Name\": \"君子庄\",\r\n    \"Desc\": \"①拜师衡山派君子庄开启后，探索君子庄拜访长孙诚，结识长孙玉②第四年一月至第六年十二月，探索湘南，从乐悲风手下救下长孙玉③第七年四月自动触发为君子庄长孙诚送茶后，截止至第七年七月，君子庄友好到达60，探索湘南两次得知宁王阴谋④第七年八月再次探索君子庄，君子庄友好到达80，揭露贾孤山阴谋，打赢贾孤山后，医术到达高手，再次探索君子庄长孙诚加入，解锁君子庄⑤探索君子庄可向长孙诚学习儒学、音律、术数、翰墨\\\\n-可重复\",\r\n    \"DetailDesc\": \"位于湘南郴州府永兴县北，由长孙诚创立，庄中弟子皆需修文练武，研习君子六艺，庄主【三湘君子】长孙诚乃是弘治朝传胪，温和儒雅，文武双全，荆湘各府世家望族多因仰慕其学识名望而让族中子弟拜入门下。\",\r\n    \"LockDesc\": \"加入衡山派，长孙诚冬学期间儒学入门，君子庄友好到达20后，探索雁客轩受邀开启。\\\\n与君子庄友好度到达100解锁。\",\r\n    \"RepeatDesc\": \"探索君子庄可向长孙诚学习儒学、音律、术数、翰墨。\",\r\n    \"GuidDescList\": [\r\n      \"加入衡山派，长孙诚冬学期间儒学入门，君子庄友好到达20后，探索雁客轩受邀开启。\\\\n与君子庄友好度到达100解锁。\",\r\n      \"拜师衡山派君子庄开启后，探索君子庄拜访长孙诚，结识长孙玉。\",\r\n      \"第四年一月至第六年十二月，探索湘南，从乐悲风手下救下长孙玉。\",\r\n      \"第七年四月自动触发为君子庄长孙诚送茶。\",\r\n      \"截止至第七年七月，君子庄友好到达60，探索湘南两次得知宁王阴谋。\",\r\n      \"第七年八月再次探索君子庄，君子庄友好到达80，揭露贾孤山阴谋，打赢贾孤山后，医术到达高手救治长孙诚。\",\r\n      \"探索君子庄长孙诚加入，解锁君子庄。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"君子莊\",\r\n    \"DescTw\": \"①拜師衡山派君子莊開啟後，探索君子莊拜訪長孫誠，結識長孫玉②第四年一月至第六年十二月，探索湘南，從樂悲風手下救下長孫玉③第七年四月自動觸發為君子莊長孫誠送茶後，截止至第七年七月，君子莊友好到達60，探索湘南兩次得知寧王陰謀④第七年八月再次探索君子莊，君子莊友好到達80，揭露賈孤山陰謀，打贏賈孤山後，醫術到達高手，再次探索君子莊長孫誠加入，解鎖君子莊⑤探索君子莊可向長孫誠學習儒學、音律、術數、翰墨\\\\n-可重複\",\r\n    \"DetailDescTw\": \"位於湘南郴州府永興縣北，由長孫誠創立，莊中弟子皆需修文練武，研習君子六藝，莊主【三湘君子】長孫誠乃是弘治朝傳臚，溫和儒雅，文武雙全，荊湘各府世家望族多因仰慕其學識名望而讓族中子弟拜入門下。\",\r\n    \"LockDescTw\": \"加入衡山派，長孫誠冬學期間儒學入門，君子莊友好到達20後，探索雁客軒受邀開啟。\\\\n與君子莊友好度到達100解鎖。\",\r\n    \"RepeatDescTw\": \"探索君子莊可向長孫誠學習儒學、音律、術數、翰墨。\",\r\n    \"GuidDescTwList\": [\r\n      \"加入衡山派，長孫誠冬學期間儒學入門，君子莊友好到達20後，探索雁客軒受邀開啟。\\\\n與君子莊友好度到達100解鎖。\",\r\n      \"拜師衡山派君子莊開啟後，探索君子莊拜訪長孫誠，結識長孫玉。\",\r\n      \"第四年一月至第六年十二月，探索湘南，從樂悲風手下救下長孫玉。\",\r\n      \"第七年四月自動觸發為君子莊長孫誠送茶。\",\r\n      \"截止至第七年七月，君子莊友好到達60，探索湘南兩次得知寧王陰謀。\",\r\n      \"第七年八月再次探索君子莊，君子莊友好到達80，揭露賈孤山陰謀，打贏賈孤山後，醫術到達高手救治長孫誠。\",\r\n      \"探索君子莊長孫誠加入，解鎖君子莊。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

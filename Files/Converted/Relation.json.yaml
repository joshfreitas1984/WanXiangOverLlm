  - splitPath: Desc
    text: "拜师衡山派、武当派万寿帮开启后探索万寿帮拜访彭祖寿"
    translated: "Join the Hengshan Sect, and after the Wudang Sect and Longevity Sect become available, explore the Longevity Sect and visit Peng Zushou."
    qcReviewedText: "①Join the Hengshan Sect, and after the Wudang Sect and Longevity Sect become available, explore the Longevity Sect and visit Peng Zushou.\\n②From July of the fourth year to December of the sixth year, explore Xiangnan, encounter Jiang Chengchou, defeat him, capture him, and send him to Wanshou Villa.\\n③In the sixth year, when wealth reaches 5000, explore Jingdong and encounter a Lancang merchant to purchase a root from an ancient Rofu tree. If a Rofu tree root was purchased in the sixth year and has been consumed elsewhere, in the eighth year, when wealth reaches 4000, explore Jingdong again to purchase another Rofu tree root from the Lancang merchant.\\n④Starting in January of the sixth year, Wanshou Manor arrived at 80 with an old tree root, which can be used to treat Peng Zushou.\\n⑤Re‑explore Wan Shou Village with Peng Zushou joining, unlock the Longevity Sect.\\n⑥Exploring Wan Shou Manor allows you to listen to Peng Zushou recount tales of old Jianghu.\\n-Repeatable"
    qcTranslated: "1. Join the Hengshan Sect, and after the Wudang Sect and Longevity Sect become available, explore the Longevity Sect and visit Peng Zushou.\\n2. From July of the fourth year to December of the sixth year, explore Xiangnan, encounter Jiang Chengchou, defeat him, capture him, and send him to Wanshou Villa.\\n3. In the sixth year, when Wealth reaches 5000, explore Jingdong and encounter a Lancang merchant to purchase a root from an ancient Rofu tree. If a Rofu tree root was purchased in the sixth year and has been consumed elsewhere, in the eighth year, when Wealth reaches 4000, explore Jingdong again to purchase another Rofu tree root from the Lancang merchant.\\n4. Starting in January of the sixth year, once Wanshou Manor's friendship level reaches 80 and you possess an old tree root, you can use it to treat Peng Zushou.\\n5. Re‑explore Wan Shou Village with Peng Zushou joining, unlock the Longevity Sect.\\n6. Exploring Wan Shou Manor allows you to listen to Peng Zushou recount tales of old Jianghu.\\n‑Repeatable"
    qcStatus: Corrected
    qcQualityScore: 82
    qcDefectCategory: DroppedContent

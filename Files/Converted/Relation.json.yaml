- raw: "{\r\n    \"Key\": \"1007\",\r\n    \"Name\": \"神农帮\",\r\n    \"Desc\": \"①连翘儿加入后探索神农谷拜访连山谷\\\\n②任意一年四月探索神农谷遇到金枝连翘开花，得知连翘儿有三个愿望，连翘花开第一个愿望\\\\n③第七年一月开始，财富到达五千，探索荆东开启荆南宝象阁后，从宝象阁购买，第一个老树根消耗后，财富到达三千，可在探索宝象阁再次购买老树根。\\\\n④探索神农谷将柔佛老树根赠与连山谷种植长生稻，完成连翘儿第二个愿望\\\\n⑤探索神农谷得知连翘儿第三个愿望并完成⑥探索神农谷再次拜访连山谷，服用长生稻，连山谷加入，解锁神农帮⑥探索神农谷可向连山谷学习医术\\\\n-可重复\",\r\n    \"DetailDesc\": \"位于荆北郧阳府神农架中，由郧阳一带药农所组成，凭着历经数代所创的药谷之术闻名，谷中门人多以采药和种植药谷为业。谷主【九指神农】连山谷宽和慷慨，温厚敦良，一生执着于培育出前人所记载的“长生稻”。\",\r\n    \"LockDesc\": \"第四年时探索湘东连翘儿加入后，再次探索湘东服用七香豆后开启。\\\\n与神农帮友好度到达100解锁。\",\r\n    \"RepeatDesc\": \"探索神农谷可向连山谷学习医术。\",\r\n    \"GuidDescList\": [\r\n      \"探索神农谷拜访连山谷。\",\r\n      \"任意一年四月探索神农谷遇到金枝连翘开花，得知连翘儿有三个愿望，连翘花开达成了第一个愿望。\",\r\n      \"探索神农谷将柔佛老树根赠与连山谷种植长生稻，完成连翘儿第二个愿望。第七年一月开始，财富到达五千，探索荆东开启荆南宝象阁后，从宝象阁购买，第一个老树根消耗后，财富到达三千，可在探索宝象阁再次购买老树根。\",\r\n      \"探索神农谷得知连翘儿第三个愿望并完成。\",\r\n      \"神农帮友好度达到80，探索神农谷再次拜访连山谷，服用长生稻，连山谷加入，解锁神农帮。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"神農幫\",\r\n    \"DescTw\": \"①連翹兒加入後探索神農谷拜訪連山谷\\\\n②任意一年四月探索神農谷遇到金枝連翹開花，得知連翹兒有三個願望，連翹花開第一個願望\\\\n③第七年一月開始，財富到達五千，探索荊東開啟荊南寶象閣後，從寶象閣購買，第一個老樹根消耗後，財富到達三千，可在探索寶象閣再次購買老樹根。\\\\n④探索神農谷將柔佛老樹根贈與連山谷種植長生稻，完成連翹兒第二個願望\\\\n⑤探索神農谷得知連翹兒第三個願望並完成⑥探索神農谷再次拜訪連山谷，服用長生稻，連山谷加入，解鎖神農幫⑥探索神農谷可向連山谷學習醫術\\\\n-可重複\",\r\n    \"DetailDescTw\": \"位於荊北鄖陽府神農架中，由鄖陽一帶藥農所組成，憑著歷經數代所創的藥谷之術聞名，谷中門人多以採藥和種植藥谷為業。谷主【九指神農】連山谷寬和慷慨，溫厚敦良，一生執著於培育出前人所記載的“長生稻”。\",\r\n    \"LockDescTw\": \"第四年時探索湘東連翹兒加入後，再次探索湘東服用七香豆後開啟。\\\\n與神農幫友好度到達100解鎖。\",\r\n    \"RepeatDescTw\": \"探索神農谷可向連山谷學習醫術。\",\r\n    \"GuidDescTwList\": [\r\n      \"探索神農谷拜訪連山谷。\",\r\n      \"任意一年四月探索神農谷遇到金枝連翹開花，得知連翹兒有三個願望，連翹花開達成了第一個願望。\",\r\n      \"探索神農谷將柔佛老樹根贈與連山谷種植長生稻，完成連翹兒第二個願望。第七年一月開始，財富到達五千，探索荊東開啟荊南寶象閣後，從寶象閣購買，第一個老樹根消耗後，財富到達三千，可在探索寶象閣再次購買老樹根。\",\r\n      \"探索神農谷得知連翹兒第三個願望並完成。\",\r\n      \"神農幫友好度達到80，探索神農谷再次拜訪連山谷，服用長生稻，連山谷加入，解鎖神農幫。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

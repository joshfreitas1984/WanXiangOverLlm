    qcReviewedText: "①Starting from January of the third year, when wealth reaches 50, encounter the Fuqing Troupe performing on the street while exploring Jingnan. Choose to continue watching the performance to begin the Tree Shade Alley.\\n②Wealth reached 500, explore Jingnan Clan's Joyful Celebration Team settlement account.\\n③Starting from January of the seventh year, the Friendly Fuqing Class arrived at 60, and upon exploring Tree Shade Alley, they witnessed the divine relics of the Heavenly Ascension Temple.\\n④Explore Jingnan and visit the Tongtian Monastery\\n⑤Explore Tree Shade Alley to uncover the secrets of the divine relics.\\n⑥Exploring Jingnan, saving an old man at the Tiantong Monastery, causing a ruckus at the Tiantong Monastery, and being defused by Tiantong\\n⑦Fuching Class has arrived amicably at 80. Explore Jingnan and encounter Tiantong's retaliation. Help the Fuching Class seek vengeance and unlock their potential."
    qcTranslated: "1. Starting from Month 1 of Year 3, when Wealth reaches 50, explore Jingnan and encounter the Fuqing Troupe performing on the street. Choose to continue watching the performance to open Tree Shade Alley.\\n2. When Wealth reaches 500, explore Jingnan to settle accounts for the Fuqing Troupe.\\n3. Starting from Month 1 of Year 7, when the Fuqing Troupe's friendship reaches 60, explore Tree Shade Alley and witness the divine miracle of Tongtian Guan.\\n4. Explore Jingnan and visit Tongtian Guan.\\n5. Explore Tree Shade Alley to learn the secret of the divine miracle.\\n6. Explore Jingnan, save an old man at Tongtian Guan, cause a ruckus at Tongtian Guan, and be Countered by Tiantong.\\n7. When the Fuqing Troupe's friendship reaches 80., explore Jingnan, encounter Tiantong's retaliation, help the Fuqing Troupe seek revenge, and unlock the Fuqing Troupe."

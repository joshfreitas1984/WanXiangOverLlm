- raw: "{\r\n    \"Key\": \"1006\",\r\n    \"Name\": \"岳麓书院\",\r\n    \"Desc\": \"①第一年破庙在破庙中遇到受伤面纱女子选择将她藏起②岳麓书院开启后，财富到达1000探索岳麓书院，答题通过儒学考试后可听学③从第四年一月到第五年十二月期间，探索湘东，战胜两书生后加入④第五年一月至第六年十二月探索岳麓书院得知晏蛾眉身世\\\\n⑤探索岳麓书院探问山长与诸位夫子询问西涯先生\\\\n⑥探索湘东击败因追查西涯先生而引来的杀手\\\\n⑦探索岳麓书院揭露元凶并战胜\\\\n⑧岳麓书院友好到达80，探索岳麓书院拜见山长。\\\\n⑨探索岳麓书院可向书院夫子学习儒学、翰墨、术数\\\\n-可重复\",\r\n    \"DetailDesc\": \"位于湘东长沙府岳麓山脚下，创立于北宋开宝年间，天下四大书院之一，汇集以“道林四友”为首的一众博学夫子，是荆湘的文坛圣地。山长【麓山先生】荀师道高风亮节，满腹经纶，是天下闻名的博雅大儒。\",\r\n    \"LockDesc\": \"第三年一月起，财富大于1000，探索湘东得知岳麓书院今年招生后开启。\\\\n与岳麓书院友好度到达100解锁。\",\r\n    \"RepeatDesc\": \"探索岳麓书院可向书院夫子学习儒学、翰墨、术数。\",\r\n    \"GuidDescList\": [\r\n      \"第一年破庙在破庙中遇到受伤面纱女子选择将她藏起。\",\r\n      \"第三年一月开始，财富大于1000，探索湘东听闻岳麓书院招生。\",\r\n      \"财富到达1000探索岳麓书院，答题通过儒学考试后可听学。\",\r\n      \"第四年一月开始，探索湘东，战胜两书生后晏蛾眉加入。\",\r\n      \"第五年一月开始探索岳麓书院得知晏蛾眉身世。\",\r\n      \"探索岳麓书院探问山长与诸位夫子询问西涯先生。\",\r\n      \"探索湘东击败因追查西涯先生而引来的杀手。\",\r\n      \"探索岳麓书院揭露元凶并战胜\",\r\n      \"岳麓书院友好到达80，探索岳麓书院拜见山长。\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"嶽麓書院\",\r\n    \"DescTw\": \"①第一年破廟在破廟中遇到受傷面紗女子選擇將她藏起②嶽麓書院開啟後，財富到達1000探索嶽麓書院，答題通過儒學考試後可聽學③從第四年一月到第五年十二月期間，探索湘東，戰勝兩書生後加入④第五年一月至第六年十二月探索嶽麓書院得知晏蛾眉身世\\\\n⑤探索嶽麓書院探問山長與諸位夫子詢問西涯先生\\\\n⑥探索湘東擊敗因追查西涯先生而引來的殺手\\\\n⑦探索嶽麓書院揭露元凶並戰勝\\\\n⑧嶽麓書院友好到達80，探索嶽麓書院拜見山長。\\\\n⑨探索嶽麓書院可向書院夫子學習儒學、翰墨、術數\\\\n-可重複\",\r\n    \"DetailDescTw\": \"位於湘東長沙府嶽麓山腳下，創立於北宋開寶年間，天下四大書院之一，彙集以“道林四友”為首的一眾博學夫子，是荊湘的文壇聖地。山長【麓山先生】荀師道高風亮節，滿腹經綸，是天下聞名的博雅大儒。\",\r\n    \"LockDescTw\": \"第三年一月起，財富大於1000，探索湘東得知嶽麓書院今年招生後開啟。\\\\n與嶽麓書院友好度到達100解鎖。\",\r\n    \"RepeatDescTw\": \"探索嶽麓書院可向書院夫子學習儒學、翰墨、術數。\",\r\n    \"GuidDescTwList\": [\r\n      \"第一年破廟在破廟中遇到受傷面紗女子選擇將她藏起。\",\r\n      \"第三年一月開始，財富大於1000，探索湘東聽聞嶽麓書院招生。\",\r\n      \"財富到達1000探索嶽麓書院，答題通過儒學考試後可聽學。\",\r\n      \"第四年一月開始，探索湘東，戰勝兩書生後晏蛾眉加入。\",\r\n      \"第五年一月開始探索嶽麓書院得知晏蛾眉身世。\",\r\n      \"探索嶽麓書院探問山長與諸位夫子詢問西涯先生。\",\r\n      \"探索湘東擊敗因追查西涯先生而引來的殺手。\",\r\n      \"探索嶽麓書院揭露元凶並戰勝\",\r\n      \"嶽麓書院友好到達80，探索嶽麓書院拜見山長。\",\r\n      \"nil\"\r\n    ]\r\n  }"

- raw: "{\r\n    \"Key\": \"1008\",\r\n    \"Name\": \"六合帮\",\r\n    \"Desc\": \"①第四年一月开始，财富到达1000探索荆北，在夏侯珺处任意购买一件物品开启六合庄\\\\n②在六合帮购买宝物根据宝物价值可提升不同程度的好感\\\\n③第七年一月开始，六合帮友好到达50，探索六合帮运送官粮，击败埋伏的崔三贯一众\\\\n④六合帮友好到达80，探索六合庄保护夏侯朝击败叛乱的钟其北后夏侯朝加入，解锁六合帮\\\\n⑤探索六合帮可选择护送商船赚钱\\\\n-可重复\",\r\n    \"DetailDesc\": \"位于荆北郧阳府郧西县内，毗邻汉江支流金钱河，由夏侯朝创立，靠着金钱河河运往来于荆湘、关陇之间，做两地的生意和运输。帮主【朝秦暮楚】夏侯朝豁达干练，广交善缘，荆湘、关陇两地与其帮中有生意往来者甚众。\",\r\n    \"LockDesc\": \"第四年一月开始，财富到达1000探索荆北，在夏侯珺处任意购买一件物品开启六合庄。\\\\n与六合帮友好度到达100解锁。\",\r\n    \"RepeatDesc\": \"探索六合帮可选择护送商船赚钱。\\\\n在六合帮购买宝物根据宝物价值可提升不同程度的好感。\",\r\n    \"GuidDescList\": [\r\n      \"第四年一月开始至第五年十二月，财富到达1000探索荆北，在夏侯珺处任意购买一件物品开启六合庄。\",\r\n      \"探索荆北六合帮，夏侯珺去荆东蕲春收购艾草。\",\r\n      \"探索荆东打败崔三贯。\",\r\n      \"探索湘东，触发绣娘剧情。\",\r\n      \"探索湘南，触发夏侯珺林话剧情。\",\r\n      \"第七年一月开始，六合帮友好到达50，探索六合帮运送官粮，击败埋伏的崔三贯一众，解锁夏侯珺红颜。\",\r\n      \"六合帮友好到达80，探索六合庄保护夏侯朝击败叛乱的钟其北后夏侯朝加入，解锁六合帮。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"六合幫\",\r\n    \"DescTw\": \"①第四年一月開始，財富到達1000探索荊北，在夏侯珺處任意購買一件物品開啟六合莊\\\\n②在六合幫購買寶物根據寶物價值可提升不同程度的好感\\\\n③第七年一月開始，六合幫友好到達50，探索六合幫運送官糧，擊敗埋伏的崔三貫一眾\\\\n④六合幫友好到達80，探索六合莊保護夏侯朝擊敗叛亂的鐘其北後夏侯朝加入，解鎖六合幫\\\\n⑤探索六合幫可選擇護送商船賺錢\\\\n-可重複\",\r\n    \"DetailDescTw\": \"位於荊北鄖陽府鄖西縣內，毗鄰漢江支流金錢河，由夏侯朝創立，靠著金錢河河運往來於荊湘、關隴之間，做兩地的生意和運輸。幫主【朝秦暮楚】夏侯朝豁達幹練，廣交善緣，荊湘、關隴兩地與其幫中有生意往來者甚眾。\",\r\n    \"LockDescTw\": \"第四年一月開始，財富到達1000探索荊北，在夏侯珺處任意購買一件物品開啟六合莊。\\\\n與六合幫友好度到達100解鎖。\",\r\n    \"RepeatDescTw\": \"探索六合幫可選擇護送商船賺錢。\\\\n在六合幫購買寶物根據寶物價值可提升不同程度的好感。\",\r\n    \"GuidDescTwList\": [\r\n      \"第四年一月開始至第五年十二月，財富到達1000探索荊北，在夏侯珺處任意購買一件物品開啟六合莊。\",\r\n      \"探索荊北六合幫，夏侯珺去荊東蘄春收購艾草。\",\r\n      \"探索荊東打敗崔三貫。\",\r\n      \"探索湘東，觸發繡娘劇情。\",\r\n      \"探索湘南，觸發夏侯珺林話劇情。\",\r\n      \"第七年一月開始，六合幫友好到達50，探索六合幫運送官糧，擊敗埋伏的崔三貫一眾，解鎖夏侯珺紅顏。\",\r\n      \"六合幫友好到達80，探索六合莊保護夏侯朝擊敗叛亂的鐘其北後夏侯朝加入，解鎖六合幫。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

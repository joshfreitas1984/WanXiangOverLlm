- raw: "{\r\n    \"Key\": \"23\",\r\n    \"Name\": \"邵轻虹\",\r\n    \"Desc\": \"①探索浣花庐，与邵轻虹辞别郜春风带方逸飞一同外出历练。②探索川西，途径青城山讲解青城派。③探索川东，途径四方山讲解唐门。④第七年一月开始，探索川西战胜幽冥道都市王樊荡秽。⑤探索川西遇都市王樊荡秽拦路，郜春风击杀樊荡秽，解锁邵轻虹红颜。\",\r\n    \"LockDesc\": \"第四年一月后，探索川西，遇到山贼被邵轻虹相救后，再次探索川西击败岑嵩，此后开放浣花庐，浣花派友好到达30后，再次探访浣花庐对战邵轻虹，输赢都可，此后再次探索川西，在浣花溪后开解心结后结识。\",\r\n    \"GuidDescList\": [\r\n      \"探索浣花庐，与邵轻虹辞别郜春风带方逸飞一同外出历练。\",\r\n      \"探索川西，途径青城山讲解青城派。\",\r\n      \"探索川东，途径四方山讲解唐门。\",\r\n      \"第七年一月开始，探索川西战胜幽冥道都市王樊荡秽。\",\r\n      \"探索川西遇都市王樊荡秽拦路，郜春风击杀樊荡秽，解锁邵轻虹红颜。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"邵輕虹\",\r\n    \"DescTw\": \"①探索浣花廬，與邵輕虹辭別郜春風帶方逸飛一同外出歷練。②探索川西，途徑青城山講解青城派。③探索川東，途徑四方山講解唐門。④第七年一月開始，探索川西戰勝幽冥道都市王樊蕩穢。⑤探索川西遇都市王樊蕩穢攔路，郜春風擊殺樊蕩穢，解鎖邵輕虹紅顏。\",\r\n    \"LockDescTw\": \"第四年一月後，探索川西，遇到山賊被邵輕虹相救後，再次探索川西擊敗岑嵩，此後開放浣花廬，浣花派友好到達30後，再次探訪浣花廬對戰邵輕虹，輸贏都可，此後再次探索川西，在浣花溪後開解心結後結識。\",\r\n    \"GuidDescTwList\": [\r\n      \"探索浣花廬，與邵輕虹辭別郜春風帶方逸飛一同外出歷練。\",\r\n      \"探索川西，途徑青城山講解青城派。\",\r\n      \"探索川東，途徑四方山講解唐門。\",\r\n      \"第七年一月開始，探索川西戰勝幽冥道都市王樊蕩穢。\",\r\n      \"探索川西遇都市王樊蕩穢攔路，郜春風擊殺樊蕩穢，解鎖邵輕虹紅顏。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

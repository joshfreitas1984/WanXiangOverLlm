- raw: "{\r\n    \"Key\": \"10001\",\r\n    \"Name\": \"魔侯线\",\r\n    \"GuidDescList\": [\r\n      \"第三年八月万寿庄彭祖寿寿宴时揭露蒋成筹阴谋，并击败拦路的天魔教怪客章太歧。（衡山、武当专属）\",\r\n      \"第四年一月至第六年十二月，探索湘南，从天魔教怪客乐悲风手中救下长孙玉。（衡山专属，非必要）\",\r\n      \"第五年五月至第八年二月，探索荆南，除掉了尘，救下邹九思。（洞庭专属，非必要）\",\r\n      \"第四年一月开始，开放挂锤庄并拜访后，探索湘北战胜洪十四。（非必要）\",\r\n      \"第七年一月开始，救下身中天魔教圣心丹剧毒反噬的沈蓉蓉。（非必要）\",\r\n      \"第九年一月开始，探索湘东，听闻温残阳出现，开启息心亭，探索息心亭击败天魔教魔相温残阳，开启魔侯结局。\\\\n<color=#ff0000>注意：</color><color=#ffffff>触发此事件后将开启魔侯线结局，无法在在宁王招贤擂结束后选择继续搅闹的选项。</color>\\\\n粉碎阴谋三件后，在最终剿灭魔教时，可于秘魔崖下发现通往后山的小道。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"魔侯線\",\r\n    \"GuidDescTwList\": [\r\n      \"第三年八月萬壽莊彭祖壽壽宴時揭露蔣成籌陰謀，並擊敗攔路的天魔教怪客章太歧。（衡山、武當專屬）\",\r\n      \"第四年一月至第六年十二月，探索湘南，從天魔教怪客樂悲風手中救下長孫玉。（衡山專屬，非必要）\",\r\n      \"第五年五月至第八年二月，探索荊南，除掉了塵，救下鄒九思。（洞庭專屬，非必要）\",\r\n      \"第四年一月開始，開放掛錘莊並拜訪後，探索湘北戰勝洪十四。（非必要）\",\r\n      \"第七年一月開始，救下身中天魔教聖心丹劇毒反噬的沈蓉蓉。（非必要）\",\r\n      \"第九年一月開始，探索湘東，聽聞溫殘陽出現，開啟息心亭，探索息心亭擊敗天魔教魔相溫殘陽，開啟魔侯結局。\\\\n<color=#ff0000>注意：</color><color=#ffffff>觸發此事件後將開啟魔侯線結局，無法在在寧王招賢擂結束後選擇繼續攪鬧的選項。</color>\\\\n粉碎陰謀三件後，在最終剿滅魔教時，可於祕魔崖下發現通往後山的小道。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

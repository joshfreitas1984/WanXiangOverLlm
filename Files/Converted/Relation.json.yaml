  - splitPath: DetailDesc
    text: "位于川东泸州城东，原名舞墨山庄，当代庄主【三分入木】谈庭玉素慕先贤雅事，将其更名，谈氏一族世居川东，于川蜀文坛素有清望，谈庭玉笔法意韵更胜前人，所作书法在川蜀之地备受推崇，不少文人名士皆争相临习。"
    translated: "Located in the eastern part of Luozhou City, Sichuan Province, the original name of this place was Womokou Village Master Manor. Contemporary Manor Master Tan Tingyu admired the noble deeds of ancient sages and renamed it accordingly. The Tan family has resided in eastern Sichuan for generations, holding a distinguished reputation in the local literary circles. Tan Tingyu's calligraphy techniques and artistic nuances surpass those of his predecessors, earning him widespread respect and admiration throughout Sichuan Province. Many renowned scholars and literati have eagerly sought to emulate his works."
    qcReviewedText: "Located in the eastern part of Luozhou City, Sichuan Province, the original name of this place was Womokou Village Master Manor. Contemporary Manor Master Tan Tingyu admired the noble deeds of ancient sages and renamed it accordingly. The Tan family has resided in eastern Sichuan for generations, holding a distinguished reputation in the local literary circles. Tan Tingyu's calligraphy techniques and artistic nuances surpass those of his predecessors, earning him widespread respect and admiration throughout Sichuan Province. Many renowned scholars and literati have eagerly sought to emulate his works."
    qcTranslated: "Located in the eastern part of Luozhou City, Sichuan Province, this place was originally named Wumo Manor. The contemporary Manor Master Tan Tingyu, who deeply admired the elegant pursuits of past sages, renamed it accordingly. The Tan clan has resided in eastern Sichuan for generations and has long held a distinguished reputation in the literary circles of Sichuan and Shu. Tan Tingyu's calligraphy style and artistic charm surpass those of his predecessors; his works are highly esteemed throughout the region, with many renowned scholars and literati vying to copy and study them."

- raw: "{\r\n    \"Key\": \"1011\",\r\n    \"Name\": \"洗墨山庄\",\r\n    \"Desc\": \"①拜访洗墨山庄，受邀此后可来学习翰墨。\\\\n②洗墨山庄友好到达40，翰墨到达入门，探索洗墨山庄谈庭玉传授永字八法。\\\\n③探索洗墨山庄谈庭玉帮助解惑。\\\\n④洗墨山庄友好到达60，翰墨到达高手，探索洗墨山庄谈庭玉传授三绝技法之一。\\\\n⑤解锁谈文秀红颜后，探索洗墨山庄加入。\\\\n⑥探索洗墨山庄可习学翰墨技艺\\\\n-可重复\",\r\n    \"DetailDesc\": \"位于川东泸州城东，原名舞墨山庄，当代庄主【三分入木】谈庭玉素慕先贤雅事，将其更名，谈氏一族世居川东，于川蜀文坛素有清望，谈庭玉笔法意韵更胜前人，所作书法在川蜀之地备受推崇，不少文人名士皆争相临习。\",\r\n    \"LockDesc\": \"第四年一月开始，悟性到达100，探索湘南在浯溪石刻遇到谈庭玉，此后探索湘西在法相岩再次遇到谈庭玉后开启。\\\\n与洗墨山庄友好度到达100解锁。\",\r\n    \"RepeatDesc\": \"探索洗墨山庄可向谈庭玉学习翰墨。\",\r\n    \"GuidDescList\": [\r\n      \"拜访洗墨山庄，受邀此后可来学习翰墨。\",\r\n      \"洗墨山庄友好到达40，翰墨到达入门，探索洗墨山庄谈庭玉传授永字八法。\",\r\n      \"探索洗墨山庄谈庭玉帮助解惑。\",\r\n      \"洗墨山庄友好到达60，翰墨到达高手，探索洗墨山庄谈庭玉传授三绝技法之一。\",\r\n      \"洗墨山庄友好到达80，且解锁谈文秀红颜后，再次探索洗墨山庄加入，解锁洗墨山庄。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"洗墨山莊\",\r\n    \"DescTw\": \"①拜訪洗墨山莊，受邀此後可來學習翰墨。\\\\n②洗墨山莊友好到達40，翰墨到達入門，探索洗墨山莊談庭玉傳授永字八法。\\\\n③探索洗墨山莊談庭玉幫助解惑。\\\\n④洗墨山莊友好到達60，翰墨到達高手，探索洗墨山莊談庭玉傳授三絕技法之一。\\\\n⑤解鎖談文秀紅顏後，探索洗墨山莊加入。\\\\n⑥探索洗墨山莊可習學翰墨技藝\\\\n-可重複\",\r\n    \"DetailDescTw\": \"位於川東瀘州城東，原名舞墨山莊，當代莊主【三分入木】談庭玉素慕先賢雅事，將其更名，談氏一族世居川東，於川蜀文壇素有清望，談庭玉筆法意韻更勝前人，所作書法在川蜀之地備受推崇，不少文人名士皆爭相臨習。\",\r\n    \"LockDescTw\": \"第四年一月開始，悟性到達100，探索湘南在浯溪石刻遇到談庭玉，此後探索湘西在法相巖再次遇到談庭玉後開啟。\\\\n與洗墨山莊友好度到達100解鎖。\",\r\n    \"RepeatDescTw\": \"探索洗墨山莊可向談庭玉學習翰墨。\",\r\n    \"GuidDescTwList\": [\r\n      \"拜訪洗墨山莊，受邀此後可來學習翰墨。\",\r\n      \"洗墨山莊友好到達40，翰墨到達入門，探索洗墨山莊談庭玉傳授永字八法。\",\r\n      \"探索洗墨山莊談庭玉幫助解惑。\",\r\n      \"洗墨山莊友好到達60，翰墨到達高手，探索洗墨山莊談庭玉傳授三絕技法之一。\",\r\n      \"洗墨山莊友好到達80，且解鎖談文秀紅顏後，再次探索洗墨山莊加入，解鎖洗墨山莊。\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

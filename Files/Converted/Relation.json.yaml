- raw: "{\r\n    \"Key\": \"1000\",\r\n    \"Name\": \"盘蛇谷\",\r\n    \"Desc\": \"①御兽到达入门探索盘蛇谷蒋疠夫传授牧蛇术\\\\n②第五年一月起，好感到达50可去荆东帮助阮碧青送家信\\\\n③探索荆东送完家信后再次探索盘蛇谷回报阮碧青\\\\n④第六年一月起，若盘蛇谷与阮碧青友好度都到达60，探索盘蛇谷内可发现阮碧青暗算蒋疠夫，选择帮助蒋疠夫\\\\n⑤第六年一月起，御兽到达大师，探索九嶷山遇到异蛇王，战胜后选择杀蛇取胆以做后用获取异蛇王胆\\\\n⑥第六年一月起，御兽到达大师，探索九嶷山遇到异蛇王，战胜后选择杀蛇取胆\\\\n⑦探索盘蛇谷将异蛇王胆赠与蒋疠夫治伤\\\\n⑧再次探索盘蛇谷，蒋疠夫伤愈加入，解锁盘蛇谷\\\\n⑨探索盘蛇谷可向蒋疠夫、阮碧青学习御兽-可重复\",\r\n    \"DetailDesc\": \"位于湘南永州府宁远县九嶷山深处，由永州捕蛇人组成，历经数代而创立，以毒术和牧蛇之术闻名，谷中门人多以牧蛇为业，亦善制多种秘药。谷主【食虺神君】蒋疠夫孤僻乖戾，出手狠辣，与江湖中人少有往来。\",\r\n    \"LockDesc\": \"帮助碧衣女子打跑混混并在九嶷山获得蛇胆后，再次探索湘南拜访盘蛇谷后开启。\\\\n与盘蛇谷友好度到达100解锁。\",\r\n    \"RepeatDesc\": \"探索盘蛇谷可向蒋疠夫、阮碧青学习御兽。\",\r\n    \"GuidDescList\": [\r\n      \"御兽到达入门探索盘蛇谷蒋疠夫传授牧蛇术。\",\r\n      \"探索盘蛇谷认阮碧青为姐姐。\",\r\n      \"第五年一月起，好感到达50可去荆东帮助阮碧青送家信。\",\r\n      \"探索荆东送完家信后再次探索盘蛇谷回报阮碧青。\",\r\n      \"第六年一月起，若盘蛇谷与阮碧青友好度都到达60，探索盘蛇谷内可发现阮碧青暗算蒋疠夫，选择帮助蒋疠夫。\",\r\n      \"第六年一月起，御兽到达大师，探索九嶷山遇到异蛇王，战胜后选择杀蛇取胆以做后用获取异蛇王胆。\",\r\n      \"探索盘蛇谷将异蛇王胆赠与蒋疠夫治伤。\",\r\n      \"再次探索盘蛇谷，蒋疠夫伤愈加入，解锁盘蛇谷。\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ],\r\n    \"NameTw\": \"盤蛇谷\",\r\n    \"DescTw\": \"①御獸到達入門探索盤蛇谷蔣癘夫傳授牧蛇術\\\\n②第五年一月起，好感到達50可去荊東幫助阮碧青送家信\\\\n③探索荊東送完家信後再次探索盤蛇谷回報阮碧青\\\\n④第六年一月起，若盤蛇谷與阮碧青友好度都到達60，探索盤蛇谷內可發現阮碧青暗算蔣癘夫，選擇幫助蔣癘夫\\\\n⑤第六年一月起，御獸到達大師，探索九嶷山遇到異蛇王，戰勝後選擇殺蛇取膽以做後用獲取異蛇王膽\\\\n⑥第六年一月起，御獸到達大師，探索九嶷山遇到異蛇王，戰勝後選擇殺蛇取膽\\\\n⑦探索盤蛇谷將異蛇王膽贈與蔣癘夫治傷\\\\n⑧再次探索盤蛇谷，蔣癘夫傷愈加入，解鎖盤蛇谷\\\\n⑨探索盤蛇谷可向蔣癘夫、阮碧青學習御獸-可重複\",\r\n    \"DetailDescTw\": \"位於湘南永州府寧遠縣九嶷山深處，由永州捕蛇人組成，歷經數代而創立，以毒術和牧蛇之術聞名，谷中門人多以牧蛇為業，亦善制多種祕藥。谷主【食虺神君】蔣癘夫孤僻乖戾，出手狠辣，與江湖中人少有往來。\",\r\n    \"LockDescTw\": \"幫助碧衣女子打跑混混並在九嶷山獲得蛇膽後，再次探索湘南拜訪盤蛇谷後開啟。\\\\n與盤蛇谷友好度到達100解鎖。\",\r\n    \"RepeatDescTw\": \"探索盤蛇谷可向蔣癘夫、阮碧青學習御獸。\",\r\n    \"GuidDescTwList\": [\r\n      \"御獸到達入門探索盤蛇谷蔣癘夫傳授牧蛇術。\",\r\n      \"探索盤蛇谷認阮碧青為姐姐。\",\r\n      \"第五年一月起，好感到達50可去荊東幫助阮碧青送家信。\",\r\n      \"探索荊東送完家信後再次探索盤蛇谷回報阮碧青。\",\r\n      \"第六年一月起，若盤蛇谷與阮碧青友好度都到達60，探索盤蛇谷內可發現阮碧青暗算蔣癘夫，選擇幫助蔣癘夫。\",\r\n      \"第六年一月起，御獸到達大師，探索九嶷山遇到異蛇王，戰勝後選擇殺蛇取膽以做後用獲取異蛇王膽。\",\r\n      \"探索盤蛇谷將異蛇王膽贈與蔣癘夫治傷。\",\r\n      \"再次探索盤蛇谷，蔣癘夫傷愈加入，解鎖盤蛇谷。\",\r\n      \"nil\",\r\n      \"nil\"\r\n    ]\r\n  }"

- raw: "这小兄弟虽然有些莽撞，但是根骨清正，为人正直，是个可造之材，不过现今咱们还是去各派回礼要紧，若他与本派真是有缘，待到咱们回来之时再到这店里看看，若是还在，再做考虑吧。"

  result: "This Little Brother may be a bit reckless, but his foundations are sound and his character upright. He is a promising talent. For now, though, returning courtesy calls to the other sects comes first. If he truly has a bond with our sect, we can look in at this shop again when we return, and if he is still here, we will consider it then."

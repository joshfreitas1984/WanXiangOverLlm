- raw: "{\r\n    \"Key\": \"20009\",\r\n    \"Title\": \"江湖消息\",\r\n    \"ConditionSatisfiedDesc\": \"听闻有人在<color=#77CED9>湘东野猪林</color>见到了一只体型硕大的野猪，恐怕以不止千斤，曾有江湖中人去探查，却未曾发现，看来若不善于<color=#77CED9>御兽</color>之术，难以将其引出。\",\r\n    \"ConditionUnsatisfiedDesc\": \"听闻有人在<color=#77CED9>湘东野猪林</color>见到了一只体型硕大的野猪，宛如一座小山一般，恐怕以不止千斤，曾有江湖中人去探查，却未曾发现，看来若非<color=#77CED9>福缘</color>深厚之辈看来也无法发现它的踪迹。\",\r\n    \"ConditionSatisfiedDescTw\": \"聽聞有人在<color=#77CED9>湘東野豬林</color>見到了一隻體型碩大的野豬，恐怕以不止千斤，曾有江湖中人去探查，卻未曾發現，看來若不善於<color=#77CED9>御獸</color>之術，難以將其引出。\",\r\n    \"ConditionUnsatisfiedDescTw\": \"聽聞有人在<color=#77CED9>湘東野豬林</color>見到了一隻體型碩大的野豬，宛如一座小山一般，恐怕以不止千斤，曾有江湖中人去探查，卻未曾發現，看來若非<color=#77CED9>福緣</color>深厚之輩看來也無法發現它的蹤跡。\",\r\n    \"TitleTw\": \"江湖訊息\"\r\n  }"
